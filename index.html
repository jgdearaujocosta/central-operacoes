    <div class="tw"><table class="t atv-tab"><thead><tr><th>Colaborador</th><th class="num">Dias trab.</th>${th}<th class="num"><span class="atv-th">${TRAB_CAL.emoji}<small>Trabalhos</small></span></th><th class="num">Extras</th><th class="num">Trabalhos R$</th><th class="num">Total</th></tr></thead><tbody>
    ${uRows.map(({ id, r }) => `<tr><td><button class="linkbtn" data-act="ativ-ver-user" data-id="${id}">${esc(nomeResp(id))}</button></td><td class="num">${r.dias.size}</td>${colKeys.map(k => `<td class="num ${contaTipo(r, k) ? "" : "muted"}">${contaTipo(r, k) || "–"}</td>`).join("")}<td class="num ${r.trabN ? "" : "muted"}">${r.trabN || "–"}</td><td class="num">${fmtBRL(r.extras)}</td><td class="num">${fmtBRL(r.trabV)}</td><td class="num"><b>${fmtBRL(r.valor)}</b></td></tr>`).join("")}
    </tbody><tfoot><tr><td>Total</td><td class="num">${tot.dias.size}</td>${colKeys.map(k => `<td class="num">${contaTipo(tot, k)}</td>`).join("")}<td class="num">${tot.trabN}</td><td class="num">${fmtBRL(tot.extras)}</td><td class="num">${fmtBRL(tot.trabV)}</td><td class="num">${fmtBRL(tot.valor)}</td></tr></tfoot></table></div>
    <p class="small muted" style="padding:10px 16px 14px">Escritório e Home Office contam em dias. As demais atividades e os trabalhos aprovados contam pela quantidade. Clique no nome para abrir o calendário da pessoa.</p></div>`;
  const porMarca = {}; filtrada.forEach(a => { (porMarca[a.marcaId || INTERNO] ||= { a: [], t: [] }).a.push(a); }); trabsF.forEach(t => { (porMarca[t.marcaId || INTERNO] ||= { a: [], t: [] }).t.push(t); });
  const mRows = Object.entries(porMarca).map(([id, g]) => ({ id, arr: [...g.a, ...g.t], acts: g.a, r: resumoCal(g.a, g.t), pessoas: new Set([...g.a, ...g.t].map(a => a.userId)) })).sort((a, b) => (a.id === INTERNO) - (b.id === INTERNO) || b.arr.length - a.arr.length);
  const maxN = Math.max(...mRows.map(x => x.arr.length));
  const tabM = `<div class="card"><div class="card-h"><h2>Por marca <span class="sub">quanto trabalho foi feito para cada cliente</span></h2></div>
    <div class="tw"><table class="t"><thead><tr><th>Marca</th><th class="num">Registros</th><th>Distribuição</th><th>Por tipo</th><th class="num">Pessoas</th><th class="num">Dias</th><th class="num">Valores</th></tr></thead><tbody>
    ${mRows.map(({ id, arr, r, pessoas }) => `<tr><td><b>${esc(marcaAtiv(id))}</b></td><td class="num">${arr.length}</td><td style="min-width:120px"><div class="atv-bar"><i style="width:${Math.round(arr.length / maxN * 100)}%"></i></div></td><td><div class="atv-mix">${ATIV_KEYS.filter(k => r.porTipo[k].n).map(k => `<span title="${esc(ativNome(k))}">${ATIV[k].emoji} ${r.porTipo[k].n}</span>`).join("")}${r.trabN ? `<span title="Trabalhos aprovados">${TRAB_CAL.emoji} ${r.trabN}</span>` : ""}</div></td><td class="num" title="${esc([...pessoas].map(nomeResp).join(", "))}">${pessoas.size}</td><td class="num">${new Set(arr.map(a => a.data)).size}</td><td class="num">${fmtBRL(r.valor)}</td></tr>`).join("")}
    </tbody></table></div></div>`;
  return filtros + tabU + tabM;
}
</script>
<script>
"use strict";
/* ---------- View: Marcas ---------- */
function viewMarcas() {
  if (!isAdmin()) return viewMarcasColab();
  if (UI.marcaId && getMarca(UI.marcaId)) return viewMarca(getMarca(UI.marcaId));
  const mes = UI.mes;
  const grupos = { ativo: [], pausado: [], encerrado: [] };
  core().marcas.forEach(m => (grupos[m.status] || grupos.ativo).push(m));
  const card = m => {
    const c = getContrato(m.id); const r = resumo(itensMes(mes).filter(it => it.marcaId === m.id)); const f = financeiro(m.id, mes);
    return `<button class="bcard" data-act="open-marca" data-id="${m.id}">
      <div class="mname">${logoHTML(m)}<div><b>${esc(m.nome)}</b><small>${esc(m.categoria || "Sem categoria")}</small></div><span style="margin-left:auto">${badge(MARCA_ST[m.status].label, MARCA_ST[m.status].cls)}</span></div>
      <div class="row2"><span>Contrato</span><b>${c ? fmtBRL(f.valor) + "/mês" : "Não cadastrado"}</b></div>
      <div class="row2"><span>Minha parte</span><b>${c ? fmtBRL(f.parte) : "—"}</b></div>
      <div class="row2"><span>Vigência</span><b>${c ? `${fmtDataL(c.inicio)} a ${c.fim ? fmtDataL(c.fim) : "indeterminado"}` : "—"}</b></div>
      <div><div class="row2" style="margin-bottom:6px"><span>${labelMesC(mes)}</span><b>${r.concluido}/${r.total}</b></div>${pbar(r.pct)}</div>
    </button>`;
  };
  const sec = (t, arr) => arr.length ? `<h3 style="font-size:14px;margin:22px 0 10px;color:var(--muted);font-weight:500">${t} (${arr.length})</h3><div class="brand-cards">${arr.map(card).join("")}</div>` : "";
  return pageHead("Marcas", `${core().marcas.length} ${core().marcas.length === 1 ? "marca" : "marcas"} na carteira`, `<button class="btn primary" data-act="nova-marca">${IC.plus}Nova marca</button>`) +
    (core().marcas.length ? sec("Ativas", grupos.ativo) + sec("Pausadas", grupos.pausado) + sec("Encerradas", grupos.encerrado)
      : `<div class="card">${emptyState("Nenhuma marca cadastrada", "Cadastre uma marca com contrato e entregas para começar.", `<button class="btn primary" data-act="nova-marca">Cadastrar marca</button>`)}</div>`);
}

function viewMarca(m) {
  const mes = UI.mes; const c = getContrato(m.id); const f = financeiro(m.id, mes); const t = termos(c, mes);
  const tabs = [["mes", `Mês: ${labelMesC(mes)}`], ["entregas", "Entregas contratuais"], ["contrato", "Contrato e financeiro"], ["historico", "Histórico"], ["equipe", "Custos de equipe"], ["relatorio", "Relatório"], ["info", "Dados da marca"]];
  const head = `<button class="back" data-act="voltar-marcas">${IC.left}Marcas</button>
    <div class="brand-head">${logoHTML(m, true)}<div><h1>${esc(m.nome)}</h1><div class="meta">${badge(MARCA_ST[m.status].label, MARCA_ST[m.status].cls)}
      <span>${esc(m.categoria || "Sem categoria")}</span>${c ? `<span>${valorContratoTxt(t)}</span><span>Minha parte ${fmtBRL(f.parte)}${t?.partTipo === "percentual" ? ` (${num(t.partValor)}%)` : ""}</span><span>Vencimento dia ${t?.vencimentoDia || "—"}</span>` : "<span>Sem contrato</span>"}</div></div>
      <div class="acts"><button class="btn" data-act="nova-demanda" data-marca="${m.id}">${IC.plus}Avulsa</button><button class="btn" data-act="editar-marca" data-id="${m.id}">${IC.edit}Editar</button></div></div>
    <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" data-act="tab" data-tab="${k}" aria-selected="${UI.tab === k}">${l}</button>`).join("")}</div>`;
  const body = { mes: tabMes, entregas: tabEntregas, contrato: tabContrato, historico: tabHistorico, equipe: tabEquipeMarca, relatorio: tabRelatorio, info: tabInfo }[UI.tab] || tabMes;
  return head + body(m, c, mes);
}

function porObrigacao(marcaId, mes) {
  const its = itensMes(mes).filter(it => it.marcaId === marcaId);
  const contr = its.filter(it => it.tipo === "contratual");
  const grupos = {};
  contr.forEach(it => { (grupos[it.linhagem] ||= []).push(it); });
  return {
    its, contr, av: its.filter(it => it.tipo === "avulsa"),
    linhas: Object.values(grupos).map(g => {
      const o = S.core.obrigacoes.find(x => x.id === g[0].obrigacaoId);
      return { nome: o?.nome || g[0].obrigacaoNome || g[0].titulo.replace(/ \d+$/, ""), cat: g[0].categoriaId, r: resumo(g), itens: g.sort((a, b) => a.seq - b.seq) };
    }).sort((a, b) => nomeCat(a.cat).localeCompare(nomeCat(b.cat)) || a.nome.localeCompare(b.nome))
  };
}

function tabMes(m, c, mes) {
  if (!S.months[mes]) return semCompetencia(mes);
  if (!c) return `<div class="card"><div class="empty-state"><b>Esta marca ainda não tem contrato</b>Cadastre o contrato para gerar as entregas mensais.<div><button class="btn primary" data-act="criar-contrato" data-id="${m.id}">Criar contrato</button></div></div></div>`;
  const { its, contr, av, linhas } = porObrigacao(m.id, mes);
  const r = resumo(contr); const rt = resumo(its);
  if (!contratoCobre(c, mes) && !its.length) return `<div class="card"><div class="empty-state"><b>Fora da vigência do contrato</b>O contrato vai de ${fmtDataL(c.inicio)} a ${c.fim ? fmtDataL(c.fim) : "indeterminado"}. Escolha outro mês ou ajuste a vigência.</div></div>`;
  const filtered = aplicaFiltros(its, { ...UI.F, marca: "" });
  const resumoCard = `<div class="card" style="margin-bottom:16px"><div class="card-h"><h2>${esc(m.nome)}, ${labelMes(mes)}</h2><span class="muted small">${r.concluido} / ${r.total} contratuais${av.length ? `, ${resumo(av).concluido}/${resumo(av).total} avulsas` : ""}</span></div>
    <div class="card-b">
      <div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-bottom:16px">
        <div><div class="muted small">Execução contratual</div><div style="font-size:30px;font-weight:600;letter-spacing:-.03em">${r.pct}%</div></div>
        <div style="flex:1;min-width:200px">${pbar(r.pct)}<div class="counts" style="margin-top:10px">${["concluido", "andamento", "a_fazer", "atrasado"].map(k => `<span><i style="background:${STATUS[k].c}"></i>${STATUS[k].label}: <b>${rt[k]}</b></span>`).join("")}</div></div>
      </div>
      ${linhas.length ? `<div class="oblist">${linhas.map(l => `<div class="ob"><div class="ob-n">${esc(nomeCat(l.cat))}, ${esc(l.nome)}</div><div class="ob-v">${l.r.concluido} <small>/ ${l.r.total}</small></div>${pbar(pct(l.r.concluido, l.r.total))}</div>`).join("")}</div>`
        : `<div class="notice">Nenhuma entrega contratual neste mês. <button class="linkbtn" data-act="tab" data-tab="entregas">Cadastrar entregas contratuais</button></div>`}
    </div></div>`;
  const filtIds = new Set(filtered.map(i => i.id));
  const lista = `<div class="card">
    ${linhas.map(l => { const vis = l.itens.filter(i => filtIds.has(i.id)); return vis.length ? `<div class="group"><div class="group-h"><h4>${esc(l.nome)}</h4><span class="tag">${esc(nomeCat(l.cat))}</span><span class="gcount">${l.r.concluido} / ${l.r.total} ${pbar(pct(l.r.concluido, l.r.total))}</span></div>${vis.map(it => itemRow(it, { showMarca: false })).join("")}</div>` : ""; }).join("")}
    <div class="group"><div class="group-h"><h4>Demandas avulsas</h4><span class="tag avulsa">Além do contrato</span><span class="gcount"><button class="btn sm" data-act="nova-demanda" data-marca="${m.id}">${IC.plus}Avulsa</button></span></div>
      ${av.filter(i => filtIds.has(i.id)).map(it => itemRow(it, { showMarca: false })).join("") || `<div class="row muted small" style="padding:12px 16px">Nenhuma demanda extra neste mês.</div>`}</div>
  </div>`;
  return resumoCard + filterBar("", true) + lista;
}

function tabEntregas(m, c, mes) {
  if (!c) return `<div class="card"><div class="empty-state"><b>Crie o contrato primeiro</b>As entregas contratuais ficam vinculadas à vigência do contrato.<div><button class="btn primary" data-act="criar-contrato" data-id="${m.id}">Criar contrato</button></div></div></div>`;
  const vig = obrigacoesEm(m.id, mes);
  const todas = core().obrigacoes.filter(o => o.marcaId === m.id).sort((a, b) => a.nome.localeCompare(b.nome) || (a.desde < b.desde ? -1 : 1));
  const total = vig.reduce((s, o) => s + qtdEm(o, mes), 0);
  const per = o => o.periodicidade === "semanal" ? `${o.quantidade}/semana` : o.periodicidade === "unica" ? `${o.quantidade} (única, ${labelMesC(o.mesUnico || o.desde)})` : o.periodicidade === "personalizada" ? `${o.quantidade} a cada ${o.intervaloMeses} meses` : `${o.quantidade}/mês`;
  return `<div class="notice" style="margin-bottom:16px">As demandas de cada mês são geradas automaticamente a partir destas entregas. Toda alteração vale a partir do mês escolhido, os meses anteriores ficam como estavam.</div>
  <div class="card" style="margin-bottom:16px"><div class="card-h"><h2>Vigentes em ${labelMes(mes)} <span class="sub">${total} entregas no mês</span></h2><button class="btn primary sm" data-act="nova-obrigacao" data-id="${m.id}">${IC.plus}Nova entrega</button></div>
    ${vig.length ? `<div class="tw"><table class="t"><thead><tr><th>Entrega</th><th>Categoria</th><th>Quantidade</th><th>Periodicidade</th><th class="num">Neste mês</th><th>Responsável</th><th>Vigência</th><th></th></tr></thead><tbody>
    ${vig.map(o => `<tr><td><b>${esc(o.nome)}</b>${o.obs ? `<div class="muted small">${esc(o.obs)}</div>` : ""}</td><td>${esc(nomeCat(o.categoriaId))}</td><td>${per(o)}</td><td>${PERIOD[o.periodicidade]}</td><td class="num">${qtdEm(o, mes)}</td><td>${esc(nomeResp(o.responsavelId))}</td><td class="small muted">${labelMesC(o.desde)}${o.ate ? ` a ${labelMesC(o.ate)}` : " em diante"}</td>
      <td class="num"><button class="icon-btn" data-act="editar-obrigacao" data-id="${o.id}" title="Editar">${IC.edit}</button><button class="icon-btn" data-act="encerrar-obrigacao" data-id="${o.id}" title="Remover">${IC.trash}</button></td></tr>`).join("")}
    </tbody></table></div>` : `<div class="empty-state"><b>Nenhuma entrega vigente neste mês</b>Cadastre o que foi combinado no contrato, por exemplo 3 Reels por mês.<div><button class="btn primary" data-act="nova-obrigacao" data-id="${m.id}">Cadastrar entrega</button></div></div>`}
  </div>
  <div class="card"><div class="card-h"><h3>Histórico de versões <span class="sub">todas as entregas já cadastradas</span></h3></div>
    ${todas.length ? `<div class="tw"><table class="t"><thead><tr><th>Entrega</th><th>Quantidade</th><th>Vigência</th><th>Situação</th></tr></thead><tbody>
    ${todas.map(o => { const ativa = o.desde <= mes && (!o.ate || o.ate >= mes); const fut = o.desde > mes;
      return `<tr><td>${esc(o.nome)}</td><td>${per(o)}</td><td>${labelMes(o.desde)} ${o.ate ? `até ${labelMes(o.ate)}` : "em diante"}</td><td>${ativa ? badge("Vigente", "b-green") : fut ? badge("Futura", "b-blue") : badge("Encerrada", "b-gray")}</td></tr>`; }).join("")}
    </tbody></table></div>` : `<div class="empty-state small">Sem histórico.</div>`}
  </div>`;
}

function tabContrato(m, c, mes) {
  if (!c) return `<div class="card"><div class="empty-state"><b>Sem contrato cadastrado</b>Informe vigência, valor mensal, vencimento e sua participação.<div><button class="btn primary" data-act="criar-contrato" data-id="${m.id}">Criar contrato</button></div></div></div>`;
  const t = termos(c, mes); const f = financeiro(m.id, mes);
  const hist = [...c.historico].sort((a, b) => a.desde < b.desde ? 1 : -1);
  return `<div class="grid g2">
    <div class="card"><div class="card-h"><h2>Contrato</h2><button class="btn sm" data-act="editar-contrato" data-id="${m.id}">${IC.edit}Editar contrato</button><button class="btn sm danger" data-act="excluir-contrato" data-id="${m.id}">${IC.trash}Excluir contrato</button></div>
      <div class="card-b"><dl class="dl">
        <dt>Início</dt><dd>${fmtDataL(c.inicio)}</dd><dt>Término</dt><dd>${c.fim ? fmtDataL(c.fim) + (diffDays(TODAY, c.fim) >= 0 ? ` <span class="muted small">(em ${diffDays(TODAY, c.fim)} dias)</span>` : ` <span class="small" style="color:var(--red)">(encerrado)</span>`) : "Indeterminado"}</dd>
        <dt>Valor do contrato</dt><dd><b>${valorContratoTxt(t)}</b> <span class="muted small">em ${labelMesC(mes)}</span></dd>
        <dt>Vencimento</dt><dd>Dia ${t?.vencimentoDia}</dd>
        <dt>Minha participação</dt><dd>${t?.partTipo === "percentual" ? `${num(t.partValor)}% = <b>${fmtBRL(f.parte)}</b>/mês` : `Valor fixo de <b>${fmtBRL(f.parte)}</b>/mês`}${ehAnual(t) ? ` <span class="muted small">(${fmtBRL(f.parte * 12)}/ano)</span>` : ""}</dd>
        <dt>Observações</dt><dd>${esc(c.obsFin || "—")}</dd>
        ${blocoPdfContrato(m, c)}
      </dl></div></div>
    <div class="card"><div class="card-h"><h2>Recebimento de ${labelMesC(mes)}</h2><button class="btn sm primary" data-act="registrar-pag" data-id="${m.id}">Registrar recebimento</button></div>
      <div class="card-b"><dl class="dl"><dt>Status</dt><dd>${pagBadge(f.status)}</dd><dt>Vencimento</dt><dd>${fmtDataL(f.venc)}</dd><dt>Recebido</dt><dd>${fmtBRL(f.recebido)} de ${fmtBRL(f.valor)}</dd><dt>Minha parte recebida</dt><dd>${fmtBRL(f.parteRec)} de ${fmtBRL(f.parte)}</dd>${f.pag.dataPagamento ? `<dt>Pago em</dt><dd>${fmtDataL(f.pag.dataPagamento)}</dd>` : ""}${f.pag.obs ? `<dt>Observação</dt><dd>${esc(f.pag.obs)}</dd>` : ""}</dl></div></div>
  </div>
  ${cardEquipeContrato(m, c, mes)}
  <div class="card" style="margin-top:16px"><div class="card-h"><h3>Histórico de valores <span class="sub">alterações valem a partir do mês indicado</span></h3></div>
    <div class="tw"><table class="t"><thead><tr><th>A partir de</th><th class="num">Valor do contrato</th><th>Minha participação</th><th class="num">Minha parte/mês</th><th>Vencimento</th></tr></thead><tbody>
    ${hist.map(h => `<tr><td>${labelMes(h.desde)}</td><td class="num">${fmtBRL(h.valor)}${ehAnual(h) ? "/ano" : "/mês"}</td><td>${h.partTipo === "percentual" ? `${num(h.partValor)}%` : "Valor fixo"}</td><td class="num">${fmtBRL(calcParte(h))}</td><td>Dia ${h.vencimentoDia}</td></tr>`).join("")}
    </tbody></table></div></div>`;
}

function mesesDaMarca(m) {
  const c = getContrato(m.id);
  const set = new Set(Object.keys(S.months).filter(k => S.months[k].items.some(it => it.marcaId === m.id)));
  if (c) { let k = ymOf(c.inicio); const end = c.fim ? ymOf(c.fim) : CUR; for (let i = 0; i < 120 && k <= end && k <= CUR; i++, k = addMonths(k, 1)) set.add(k); }
  return [...set].sort().reverse();
}
function tabHistorico(m) {
  const meses = mesesDaMarca(m);
  const rows = meses.map(k => {
    const gen = !!S.months[k];
    const its = itensMes(k).filter(it => it.marcaId === m.id);
    const r = resumo(its.filter(i => i.tipo === "contratual")); const av = its.filter(i => i.tipo === "avulsa" && i.status !== "cancelado");
    const f = financeiro(m.id, k);
    return `<tr class="click" data-act="ver-mes-marca" data-mes="${k}"><td><b>${labelMes(k)}</b>${k === CUR ? ' <span class="badge b-blue nodot">atual</span>' : ""}</td>
      <td class="num">${gen ? r.total : "—"}</td><td class="num">${gen ? r.concluido : "—"}</td><td style="min-width:160px">${gen ? prog(r.pct) : '<span class="muted small">sem registro</span>'}</td>
      <td class="num">${gen ? av.length : "—"}</td><td class="num">${f.valor ? fmtBRL(f.valor) : "—"}</td><td>${f.valor ? pagBadge(f.status) : "—"}</td></tr>`;
  }).join("");
  return `<div class="card"><div class="card-h"><h2>Entregas ao longo do contrato</h2><span class="muted small">Clique em um mês para abrir</span></div>
    <div class="tw"><table class="t"><thead><tr><th>Competência</th><th class="num">Contratadas</th><th class="num">Realizadas</th><th>Execução</th><th class="num">Avulsas</th><th class="num">Contrato</th><th>Pagamento</th></tr></thead><tbody>${rows || `<tr><td colspan="7" class="muted">Sem histórico ainda.</td></tr>`}</tbody></table></div></div>`;
}

function tabInfo(m) {
  return `<div class="card"><div class="card-h"><h2>Dados da marca</h2><div style="display:flex;gap:8px"><button class="btn sm" data-act="editar-marca" data-id="${m.id}">${IC.edit}Editar</button><button class="btn sm danger" data-act="excluir-marca" data-id="${m.id}">${IC.trash}Excluir marca</button></div></div>
    <div class="card-b"><dl class="dl"><dt>Nome</dt><dd>${esc(m.nome)}</dd><dt>Categoria</dt><dd>${esc(m.categoria || "—")}</dd><dt>Status</dt><dd>${badge(MARCA_ST[m.status].label, MARCA_ST[m.status].cls)}</dd>
    <dt>Contato</dt><dd>${esc(m.contato || "—")}</dd><dt>E-mail</dt><dd>${m.email ? `<a href="mailto:${esc(m.email)}">${esc(m.email)}</a>` : "—"}</dd><dt>Telefone</dt><dd>${esc(m.telefone || "—")}</dd><dt>Observações</dt><dd style="white-space:pre-wrap">${esc(m.obs || "—")}</dd></dl></div></div>`;
}

/* ---------- Relatório ---------- */
function relatorioHTML(m, mes) {
  const c = getContrato(m.id); const f = financeiro(m.id, mes); const t = termos(c, mes);
  const { contr, av, linhas } = porObrigacao(m.id, mes); const r = resumo(contr);
  const feitos = [...contr, ...av].filter(it => it.status === "concluido").sort((a, b) => (a.concluidoEm || a.data) < (b.concluidoEm || b.data) ? -1 : 1);
  return `<div class="report" id="reportBox">
    <div class="rtop"><div class="bz"><svg viewBox="0 0 16 26" aria-hidden="true"><path d="M11.5 0 2 14.2h5.6L3.4 26 14 10.6H8.3L11.5 0Z" fill="currentColor"/></svg><span>boltz</span></div><span class="rtag">Report // Marca</span></div>
    <h1>Relatório mensal<em>${esc(m.nome)}</em></h1><p class="rsub">${labelMes(mes)}. Entregas do contrato, demandas extras e custos de equipe.</p>
    <div class="rgrid"><div><span>Contrato</span><b>${fmtBRL(f.valor)}</b></div><div><span>Minha parte</span><b>${fmtBRL(f.parte)}</b>${t?.partTipo === "percentual" ? ` <span style="display:inline">(${num(t.partValor)}%)</span>` : ""}</div><div><span>Pagamento</span><b>${PAG[f.status].label}</b></div></div>
    <div class="rgrid"><div><span>Entregas contratadas</span><b>${r.total}</b></div><div><span>Entregas realizadas</span><b>${r.concluido}</b></div><div><span>Execução</span><b>${r.pct}%</b></div></div>
    <h2>Entregas contratuais</h2>
    <table><thead><tr><th>Entrega</th><th>Categoria</th><th class="r">Realizado</th></tr></thead><tbody>
      ${linhas.map(l => `<tr><td>${esc(l.nome)}</td><td>${esc(nomeCat(l.cat))}</td><td class="r">${l.r.concluido}/${l.r.total}</td></tr>`).join("") || `<tr><td colspan="3">Sem entregas contratuais no mês.</td></tr>`}
    </tbody></table>
    ${av.length ? `<h2>Demandas extras (além do contrato)</h2><table><thead><tr><th>Demanda</th><th>Data</th><th class="r">Status</th></tr></thead><tbody>${av.map(it => `<tr><td>${esc(it.titulo)}</td><td>${fmtDataL(it.data)}</td><td class="r">${STATUS[stEf(it)].label}</td></tr>`).join("")}</tbody></table>` : ""}
    ${feitos.length ? `<h2>Detalhamento do que foi entregue</h2><table><thead><tr><th>Item</th><th>Concluído em</th><th class="r">Link</th></tr></thead><tbody>${feitos.map(it => `<tr><td>${esc(it.titulo)}</td><td>${fmtDataL(it.concluidoEm || it.data)}</td><td class="r">${it.link ? `<a href="${esc(it.link)}" target="_blank" rel="noopener">abrir</a>` : "—"}</td></tr>`).join("")}</tbody></table>` : ""}
    ${(() => { const ts = trabalhosTodos().filter(t => t.marcaId === m.id && t.mes === mes && (t.status === "aprovado" || t.status === "pago")); return ts.length ? `<h2>Custos de equipe vinculados à marca</h2><table><thead><tr><th>Trabalho</th><th>Colaborador</th><th class="r">Valor</th></tr></thead><tbody>${ts.map(t => `<tr><td>${esc(nomeTipo(t.tipoId))}</td><td>${esc(nomeResp(t.userId))}</td><td class="r">${fmtBRL(t.valor)}</td></tr>`).join("")}<tr><td><b>Total</b></td><td></td><td class="r"><b>${fmtBRL(soma(ts, t => t.valor))}</b></td></tr></tbody></table>` : ""; })()}
    <div class="foot"><div class="bz"><svg viewBox="0 0 16 26" aria-hidden="true"><path d="M11.5 0 2 14.2h5.6L3.4 26 14 10.6H8.3L11.5 0Z" fill="currentColor"/></svg><span>boltz</span></div><span>Gerado em ${fmtDataL(TODAY)}</span></div>
  </div>`;
}
function tabRelatorio(m, c, mes) {
  if (!S.months[mes]) return semCompetencia(mes);
  return `<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap"><button class="btn primary" data-act="baixar-relatorio" data-id="${m.id}">${IC.dl}Exportar relatório</button><button class="btn" data-act="imprimir">${IC.print}Imprimir / salvar PDF</button>
    <span class="muted small" style="align-self:center">O arquivo exportado abre no navegador e pode ser salvo como PDF.</span></div>` + relatorioHTML(m, mes);
}

/* ---------- Relatórios: receita das marcas ---------- */
function relReceita() {
  const mes = UI.mes;
  const marcas = marcasFinanceirasEm(mes).filter(m => !UI.F.marca || m.id === UI.F.marca);
  const linhas = marcas.map(m => ({ m, f: financeiro(m.id, mes) })).filter(x => x.f.valor && (!UI.finFiltro || x.f.status === UI.finFiltro));
  const T = linhas.reduce((a, { f }) => ({ v: a.v + f.valor, r: a.r + f.recebido, p: a.p + f.parte, pr: a.pr + f.parteRec }), { v: 0, r: 0, p: 0, pr: 0 });
  const kpis = `<div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))">
    <div class="kpi"><div class="k-l">Total contratado</div><div class="k-v">${fmtBRL(T.v)}</div><div class="k-s">${linhas.length} ${linhas.length === 1 ? "contrato" : "contratos"}</div></div>
    <div class="kpi"><div class="k-l">Total recebido</div><div class="k-v green">${fmtBRL(T.r)}</div>${pbar(pct(T.r, T.v), "green")}</div>
    <div class="kpi" style="border-right:0"><div class="k-l">Total pendente</div><div class="k-v ${T.v - T.r > 0 ? "red" : ""}">${fmtBRL(T.v - T.r)}</div></div>
    <div class="kpi" style="border-bottom:0"><div class="k-l">Minha parte (participação)</div><div class="k-v">${fmtBRL(T.p)}</div><div class="k-s">${pct(T.p, T.v)}% do contratado</div></div>
    <div class="kpi" style="border-bottom:0"><div class="k-l">Minha parte recebida</div><div class="k-v green">${fmtBRL(T.pr)}</div>${pbar(pct(T.pr, T.p), "green")}</div>
    <div class="kpi" style="border-bottom:0;border-right:0"><div class="k-l">Minha parte pendente</div><div class="k-v">${fmtBRL(T.p - T.pr)}</div></div></div>`;
  const filtros = `<div class="filters">${selectF("marca", "Todas as marcas", S.core.marcas.map(m => [m.id, m.nome]))}
    <span class="sel"><select data-change="finfiltro" class="${UI.finFiltro ? "on" : ""}" aria-label="Status do pagamento"><option value="">Todos os pagamentos</option>${Object.entries(PAG).map(([k, v]) => `<option value="${k}" ${UI.finFiltro === k ? "selected" : ""}>${v.label}</option>`).join("")}</select></span></div>`;
  const tabela = `<div class="card" style="margin-bottom:16px"><div class="card-h"><h2>Recebimentos por marca <span class="sub">${labelMes(mes)}</span></h2></div>
    ${linhas.length ? `<div class="tw"><table class="t"><thead><tr><th>Marca</th><th class="num">Contrato</th><th class="num">Minha parte</th><th>Vencimento</th><th>Status</th><th class="num">Recebido</th><th class="num">Minha parte recebida</th><th></th></tr></thead><tbody>
    ${linhas.sort((a, b) => (a.f.venc || "") < (b.f.venc || "") ? -1 : 1).map(({ m, f }) => `<tr><td><div class="mname">${logoHTML(m)}<b>${esc(m.nome)}</b></div></td><td class="num">${fmtBRL(f.valor)}</td><td class="num">${fmtBRL(f.parte)}${f.termos?.partTipo === "percentual" ? ` <span class="muted small">(${num(f.termos.partValor)}%)</span>` : ""}</td>
      <td>${fmtDataL(f.venc)}</td>
      <td><span class="sel"><select data-change="pag-status" data-id="${m.id}" aria-label="Status do pagamento de ${esc(m.nome)}">${Object.entries(PAG).map(([k, v]) => `<option value="${k}" ${k === f.status ? "selected" : ""}>${v.label}</option>`).join("")}</select></span></td>
      <td class="num">${fmtBRL(f.recebido)}</td><td class="num">${fmtBRL(f.parteRec)}</td><td class="num"><button class="btn sm" data-act="registrar-pag" data-id="${m.id}">Registrar</button></td></tr>`).join("")}
    </tbody><tfoot><tr><td>Total</td><td class="num">${fmtBRL(T.v)}</td><td class="num">${fmtBRL(T.p)}</td><td></td><td></td><td class="num">${fmtBRL(T.r)}</td><td class="num">${fmtBRL(T.pr)}</td><td></td></tr></tfoot></table></div>`
      : `${emptyState("Nenhum contrato neste mês", "Os contratos vigentes aparecem aqui com vencimento e status de recebimento.")}`}</div>`;
  return filtros + kpis + tabela + graficoReceita(mes);
}
function graficoReceita(mes) {
  const meses = []; for (let i = -5; i <= 0; i++) meses.push(addMonths(mes, i));
  const dados = meses.map(k => { let p = 0, r = 0; marcasFinanceirasEm(k).filter(m => !UI.F.marca || m.id === UI.F.marca).forEach(m => { const f = financeiro(m.id, k); p += f.parte; r += f.parteRec; }); return { k, p, r }; });
  const max = Math.max(1, ...dados.map(d => d.p));
  const W = 640, H = 200, bw = 30, gap = (W - 40) / dados.length;
  const bars = dados.map((d, i) => { const x = 30 + i * gap + gap / 2 - bw; const hp = d.p / max * (H - 50), hr = d.r / max * (H - 50);
    return `<rect x="${x}" y="${H - 30 - hp}" width="${bw}" height="${hp}" rx="3" fill="var(--line)"><title>Prevista ${fmtBRL(d.p)}</title></rect>
      <rect x="${x + bw + 4}" y="${H - 30 - hr}" width="${bw}" height="${hr}" rx="3" fill="var(--ink)"><title>Recebida ${fmtBRL(d.r)}</title></rect>
      <text x="${x + bw + 2}" y="${H - 10}" text-anchor="middle" font-size="12" fill="var(--muted)">${labelMesC(d.k)}</text>
      <text x="${x + bw + 2}" y="${H - 36 - Math.max(hp, hr)}" text-anchor="middle" font-size="11" fill="var(--muted)">${d.p ? fmtBRL(d.p).replace("R$", "").trim() : ""}</text>`; }).join("");
  return `<div class="card"><div class="card-h"><h3>Minha participação nos últimos 6 meses</h3><div class="legend"><span><i style="background:var(--line)"></i>Prevista</span><span><i style="background:var(--ink)"></i>Recebida</span></div></div>
    <div class="card-b chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Minha parte prevista e recebida por mês">${bars}</svg></div></div>`;
}

</script>
<script>
"use strict";
/* ---------- Componentes financeiros ---------- */
function breakdown(uidU, mes, { grande = false } = {}) {
  const c = calcMes(uidU, mes);
  const linha = (l, v, s = "") => `<div class="bk-row"><span>${l}${s ? `<small>${s}</small>` : ""}</span><b>${fmtBRL(v)}</b></div>`;
  const nA = trabalhosDe(uidU, mes).filter(t => (t.status === "aprovado" || t.status === "pago")), nT = g => nA.filter(t => t.grupo === g).length;
  return `<div class="bk ${grande ? "bk-lg" : ""}">
    ${linha("Valor fixo", c.fixo)}
    ${c.contratos || alocacoesDe(uidU).length ? linha("Contratos de marcas", c.contratos, (() => { const n = alocacoesDe(uidU).filter(a => alocAtiva(a, mes)).length; return n ? `${n} ${n === 1 ? "contrato" : "contratos"}` : ""; })()) : ""}
    ${linha("Trabalhos avulsos", c.avulsos, nT("avulso") ? `${nT("avulso")} aprovados` : "")}
    ${linha("Diárias", c.diarias, nT("diaria") ? `${nT("diaria")} aprovadas` : "")}
    ${fzPode(uidU) ? linha(`Flashz · ${FZ.nome}`, c.flashz || 0, (() => { const n = fzDados(uidU).jogos.filter(j => j.d && ymOf(j.d) === mes).length; return n ? `${n} ${n === 1 ? "jogo" : "jogos"} no mês` : ""; })()) : ""}
    ${rbPode(uidU) ? linha("Reembolsos FlashZ e Boltz", c.reembolsos || 0, (() => { const n = rbDoMes(uidU, mes).filter(r => r.st === "aprovado").length; return n ? `${n} ${n === 1 ? "despesa aprovada" : "despesas aprovadas"}` : ""; })()) : ""}
    ${linha("Outros", c.outros - (c.flashz || 0) - (c.reembolsos || 0))}
    <div class="bk-row bk-total"><span>Total a receber no mês</span><b>${fmtBRL(c.total)}</b></div>
    ${c.fechado ? `<div class="bk-note">${IC.lock}Mês fechado em ${fmtDataL(c.fe.fechadoEm)}. Valores congelados.</div>` : ""}
  </div>`;
}
function cardsSituacao(uidU, mes) {
  const c = calcMes(uidU, mes);
  return `<div class="kpis k3">
    <div class="kpi"><div class="k-l">Pendente de aprovação</div><div class="k-v ${c.pendN ? "yellow" : ""}">${isAdmin() ? fmtBRL(c.pendV) : c.pendN}</div><div class="k-s">${c.pendN} ${c.pendN === 1 ? "trabalho" : "trabalhos"}, fora do total até aprovar</div></div>
    <div class="kpi"><div class="k-l">Já pago</div><div class="k-v green">${fmtBRL(c.pago)}</div><div class="k-s">${pagsDe(uidU, mes).length} ${pagsDe(uidU, mes).length === 1 ? "pagamento" : "pagamentos"}</div></div>
    <div class="kpi"><div class="k-l">A receber</div><div class="k-v">${fmtBRL(c.aReceber)}</div><div class="k-s">${mesBadge(c.status)}</div></div>
  </div>`;
}
function aplicaFiltrosT(lista) {
  const T = UI.T;
  return lista.filter(t => {
    if (!T.todos && t.mes !== UI.mes) return false;
    if (T.tipo && t.tipoId !== T.tipo) return false;
    if (T.grupo && t.grupo !== T.grupo) return false;
    if (T.marca && t.marcaId !== T.marca) return false;
    if (T.status && t.status !== T.status) return false;
    if (T.user && t.userId !== T.user) return false;
    if (T.de && t.data < T.de) return false;
    if (T.ate && t.data > T.ate) return false;
    return true;
  }).sort((a, b) => a.data < b.data ? 1 : a.data > b.data ? -1 : 0);
}
function filtrosTrab(mostrarUser) {
  const T = UI.T; const any = Object.entries(T).some(([k, v]) => v && k !== "todos");
  return `<div class="filters">
    <span class="seg" role="group" aria-label="Período"><button data-act="t-todos" data-v="0" aria-pressed="${!T.todos}">${labelMesC(UI.mes)}</button><button data-act="t-todos" data-v="1" aria-pressed="${T.todos}">Todos os meses</button></span>
    ${mostrarUser ? selectF("user", "Todos os colaboradores", S.dir.usuarios.map(u => [u.id, u.nome]), "T") : ""}
    ${selectF("grupo", "Avulso, diária e outros", Object.entries(GRUPOS), "T")}
    ${selectF("tipo", "Todos os tipos", S.dir.tipos.map(t => [t.id, t.nome]), "T")}
    ${selectF("marca", "Todas as marcas", (isAdmin() ? S.core.marcas : S.dir.marcas).map(m => [m.id, m.nome]), "T")}
    ${selectF("status", "Todos os status", Object.entries(TRAB_ST).map(([k, v]) => [k, v.curto]), "T")}
    <span class="datef"><input type="date" data-change="t-data" data-key="de" value="${T.de}" aria-label="De"><span>até</span><input type="date" data-change="t-data" data-key="ate" value="${T.ate}" aria-label="Até"></span>
    ${any ? `<button class="linkbtn" data-act="limpar-t">Limpar filtros</button>` : ""}
  </div>`;
}
function tabelaTrab(lista, { user = false, acoes = false } = {}) {
  if (!lista.length) return emptyState("Nenhum trabalho encontrado", isAdmin() ? "Lance trabalhos avulsos e diárias, ou ajuste os filtros." : "Registre um trabalho que você realizou, ou ajuste os filtros.");
  const tot = soma(lista.filter(t => t.status === "aprovado" || t.status === "pago"), t => t.valor);
  return `<div class="tw"><table class="t"><thead><tr><th>Data</th><th>Trabalho</th>${user ? "<th>Colaborador</th>" : ""}<th>Marca / projeto</th><th>Tipo</th><th class="num">Valor</th><th>Status</th><th></th></tr></thead><tbody>
    ${lista.map(t => `<tr class="click" data-act="open-trab" data-id="${t.id}"><td>${fmtDataL(t.data)}${t.mes !== ymOf(t.data) ? `<div class="muted small">competência ${labelMesC(t.mes)}</div>` : ""}</td>
      <td><b>${esc(nomeTipo(t.tipoId))}</b>${t.demandaId ? '<div class="muted small">a partir de uma demanda</div>' : ""}${t.status === "recusado" && t.motivo ? `<div class="small" style="color:var(--red)">${esc(t.motivo)}</div>` : ""}</td>
      ${user ? `<td>${esc(nomeResp(t.userId))}</td>` : ""}<td>${t.marcaId ? esc(nomeMarca(t.marcaId)) : t.marcaNova ? `${esc(t.marcaNova)}<span class="mk-nova-tag">nova</span>` : "—"}${t.projeto ? `<div class="muted small">${esc(t.projeto)}</div>` : ""}</td>
      <td>${esc(nomeTipo(t.tipoId))}<div class="muted small">${GRUPOS[t.grupo] || ""}</div></td><td class="num">${t.status === "pendente" && !isAdmin() ? "—" : fmtBRL(t.valor)}</td><td>${trabBadge(t.status, true)}</td>
      <td class="num"><div class="row-acts">${acoes && isAdmin() && t.status === "pendente" ? `<button class="btn sm" data-act="aprovar" data-id="${t.id}">Aprovar</button>` : ""}${btnExcluirTrab(t)}</div></td></tr>`).join("")}
    </tbody><tfoot><tr><td colspan="${user ? 5 : 4}">Aprovados e pagos</td><td class="num">${fmtBRL(tot)}</td><td colspan="2"></td></tr></tfoot></table></div>`;
}
function mesesFinanceiros(uidU) {
  const set = new Set();
  fixoHist(uidU).forEach(h => set.add(h.desde)); trabalhosDe(uidU).forEach(t => set.add(t.mes));
  alocacoesDe(uidU).forEach(a => { const ini = a.inicio && ymOf(a.inicio) > a.desde ? ymOf(a.inicio) : a.desde; if (ini <= CUR) set.add(ini); });
  S.equipe.fechamentos.filter(f => f.userId === uidU).forEach(f => set.add(f.mes)); pagsDe(uidU).forEach(p => set.add(p.mes));
  if (!set.size) return [];
  const ini = [...set].sort()[0]; const fim = [CUR, ...set].sort().pop(); const out = [];
  for (let m = ini; m <= fim && out.length < 120; m = addMonths(m, 1)) out.push(m);
  return out.reverse();
}
function historicoFin(uidU) {
  const ms = mesesFinanceiros(uidU);
  if (!ms.length) return emptyState("Sem histórico financeiro ainda", "Os meses aparecem aqui a partir do primeiro valor fixo ou trabalho lançado.");
  return `<div class="tw"><table class="t"><thead><tr><th>Competência</th><th class="num">Fixo</th><th class="num">Contratos</th><th class="num">Avulsos</th><th class="num">Diárias</th><th class="num">Outros</th><th class="num">Total</th><th class="num">Pago</th><th class="num">A receber</th><th>Situação</th></tr></thead><tbody>
    ${ms.map(m => { const c = calcMes(uidU, m); return `<tr class="click" data-act="mes-go" data-mes="${m}"><td><b>${labelMes(m)}</b>${m === CUR ? ' <span class="badge b-blue nodot">atual</span>' : ""}</td><td class="num">${fmtBRL(c.fixo)}</td><td class="num">${c.contratos ? fmtBRL(c.contratos) : "—"}</td><td class="num">${fmtBRL(c.avulsos)}</td><td class="num">${fmtBRL(c.diarias)}</td><td class="num">${fmtBRL(c.outros)}</td><td class="num"><b>${fmtBRL(c.total)}</b></td><td class="num">${fmtBRL(c.pago)}</td><td class="num">${fmtBRL(c.aReceber)}</td><td>${mesBadge(c.status)}</td></tr>`; }).join("")}
  </tbody></table></div>`;
}
function listaPagamentos(uidU, mes) {
  const ps = pagsDe(uidU, mes);
  if (!ps.length) return `<div class="muted small" style="padding:12px 16px">Nenhum pagamento registrado em ${labelMes(mes)}.</div>`;
  return ps.map(p => `<div class="row"><span class="r-t"><b>${fmtBRL(p.valor)}</b><span>Pago em ${fmtDataL(p.data)}${p.obs ? `, ${esc(p.obs)}` : ""}</span></span>${isAdmin() ? `<button class="icon-btn" data-act="del-pagto" data-id="${p.id}" title="Desfazer pagamento">${IC.trash}</button>` : ""}</div>`).join("");
}

/* ---------- Colaborador: Meu Dashboard ---------- */
function viewMeu() {
  const u = me(), mes = UI.mes;
  const minhas = meusItens(todosItens());
  const hoje = minhas.filter(it => it.data === TODAY && it.status !== "cancelado"), atras = minhas.filter(it => stEf(it) === "atrasado");
  const doMes = resumo(meusItens(itensMes(mes)));
  const ult = trabalhosDe(u.id).sort((a, b) => a.data < b.data ? 1 : -1).slice(0, 5);
  return `<div class="hello"><h1>Olá, ${esc(u.nome)}</h1><p>${labelMes(mes)}</p></div>
    <div class="grid g-main" style="margin-bottom:16px">
      <div class="card"><div class="card-h"><h2>Meus valores do mês</h2>${!SESSION.viewAs ? `<button class="btn sm primary" data-act="novo-trabalho">${IC.plus}Registrar trabalho</button>` : ""}</div><div class="card-b">${breakdown(u.id, mes, { grande: true })}</div></div>
      <div class="stack">${cardsSituacaoVertical(u.id, mes)}</div>
    </div>
    <div class="grid g2">
      <div class="card"><div class="card-h"><h2>Minhas demandas <span class="sub">${doMes.concluido}/${doMes.total} no mês</span></h2><button class="btn sm" data-act="nav" data-view="demandas">Ver todas</button></div>

/* ---------- Envio de arquivos: aceita JPG/PNG/PDF mesmo quando o navegador não informa o tipo;
   HEIC, BMP, TIFF e imagens acima de 20 MB viram JPG antes de enviar ---------- */
const UP_OK = ["image/png", "image/jpeg", "image/gif", "image/webp", "application/pdf"];
const UP_EXT = { jpg: "image/jpeg", jpeg: "image/jpeg", jpe: "image/jpeg", jfif: "image/jpeg", pjpeg: "image/jpeg", png: "image/png", gif: "image/gif", webp: "image/webp", pdf: "application/pdf", heic: "image/heic", heif: "image/heif", bmp: "image/bmp", tif: "image/tiff", tiff: "image/tiff", avif: "image/avif" };
const UP_ACCEPT = "application/pdf,image/*,.pdf,.jpg,.jpeg,.jfif,.png,.webp,.heic,.heif";
function tipoArquivo(f) {
  let t = String(f?.type || "").toLowerCase().split(";")[0].trim();
  if (t === "image/jpg" || t === "image/pjpeg") t = "image/jpeg"; if (t === "image/x-png") t = "image/png";
  if (!t || t === "application/octet-stream") t = UP_EXT[String(f?.name || "").split(".").pop().toLowerCase()] || "";
  return t;
}
async function paraJpeg(f, lado = 4000) {
  const bmp = await createImageBitmap(f);
  const k = Math.min(1, lado / Math.max(bmp.width, bmp.height)); const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
  const b = await new Promise(r => c.toBlob(r, "image/jpeg", .88)); if (!b) throw { code: "conv" };
  return new File([b], String(f.name || "imagem").replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
}
async function prepararUpload(f) {
  let t = tipoArquivo(f);
  if (!(t === "application/pdf" || t.startsWith("image/"))) throw { code: "tipo" };
  if (t.startsWith("image/") && (!UP_OK.includes(t) || f.size > 20 * 1024 * 1024)) { try { f = await paraJpeg(f); t = "image/jpeg"; } catch (_) { throw { code: "conv" }; } }
  if (f.size > 20 * 1024 * 1024) throw { code: "grande" };
  return { file: f, type: t };
}
async function subirArquivo(f) { const p = await prepararUpload(f); const r = await ASSETS.upload(p.file, { type: p.type }); return { id: r.id, url: r.url, nome: p.file.name, tipo: p.type, tamanho: p.file.size }; }
const msgUpload = e => ({ tipo: "Envie um PDF ou uma imagem (JPG ou PNG).", conv: "Não foi possível abrir essa imagem. Salve como JPG ou PNG e envie de novo.", grande: "Arquivo acima de 20 MB.", quota_exceeded: "Limite de armazenamento atingido.", unsupported_type: "Tipo de arquivo não aceito. Envie JPG, PNG ou PDF.", too_large: "Arquivo grande demais." })[e?.code] || "Não foi possível enviar o arquivo.";
/* ---------- Contracheques: um por colaborador por mês, ligado ao valor mensal ---------- */
const chequesDe = uidU => (S.equipe.contracheques || []).filter(c => c.userId === uidU).sort((a, b) => a.mes < b.mes ? 1 : -1);
const chequeDe = (uidU, mes) => (S.equipe.contracheques || []).find(c => c.userId === uidU && c.mes === mes);
const chequeUrl = c => c.arquivo.url || (c.arquivo.id ? "/_blob/" + c.arquivo.id : c.arquivo.dataUrl || "#");
function chequeLink(c, txt) { return `<a class="cheque-link" href="${esc(chequeUrl(c))}" target="_blank" rel="noopener">${IC.doc}<span>${esc(txt || c.arquivo.nome || "Contracheque")}</span></a>`; }
function chequeUpBtn(uidU, mes, troca) {

async function enviarCheque(uidU, mes, file) {
  if (!isAdmin() || !file) return;
  let arquivo;
  try {
    const p = await prepararUpload(file); file = p.file;
    if (ASSETS) { const r = await ASSETS.upload(file, { type: p.type }); arquivo = { id: r.id, url: r.url, nome: file.name, tipo: p.type, tamanho: file.size }; }
    else if (SESSION.mode === "local") {
      if (file.size > 3 * 1024 * 1024) { toast("No modo local, use arquivos de até 3 MB."); return; }
      const dataUrl = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(file); });
      arquivo = { nome: file.name, tipo: file.type, tamanho: file.size, dataUrl };
    } else { toast("Envio de arquivos indisponível. Recarregue a página."); return; }
  } catch (err) { toast(msgUpload(err)); return; }
  S.equipe.contracheques ||= [];
  const ant = chequeDe(uidU, mes);
  const reg = { id: ant?.id || uid("cc"), userId: uidU, mes, arquivo, valor: calcMes(uidU, mes).total, enviadoEm: new Date().toISOString(), enviadoPor: SESSION.userId };
  S.equipe.contracheques = S.equipe.contracheques.filter(c => !(c.userId === uidU && c.mes === mes)).concat(reg);
  Repo.touch("equipe"); render();
  toast(`Contracheque de ${labelMes(mes)} ${ant ? "substituído" : "enviado"} para ${nomeResp(uidU)}.`);
}

    ${users.map(u => `<tr><td><div class="mname">${avatar(u)}<div><b>${esc(u.nome)}</b><small>${esc(u.email || u.funcao || "")}</small></div></div></td><td>${badge(PAPEL[u.papel].label, PAPEL[u.papel].cls, false)}</td><td>${situ(u)}</td>
      <td class="num">${conta && u.claudeId && u.claudeId !== SESSION.cid ? `<button class="btn sm" data-act="acesso-desvincular" data-id="${u.id}">Desvincular</button>` : ""}</td></tr>`).join("")}
    </tbody></table></div></div>`;
  const ajuda = `<div class="card"><div class="card-h"><h2>Como alguém novo entra</h2></div><div class="card-b acc-help">
    <p><b>1.</b> Cadastre a pessoa em <b>Colaboradores</b>, se ainda não estiver lá.</p>
    <p><b>2.</b> No botão de compartilhar do app, adicione o e-mail dela: <b>Editor</b> para administradores, <b>Colaborador</b> para colaboradores.</p>
    <p><b>3.</b> Ela abre o link logada no claude.ai, escolhe o próprio nome, cria a senha e já entra. Não precisa de liberação.</p>
    <p><b>4.</b> Se quiser garantir que só a pessoa certa use um nome, preencha o <b>e-mail</b> dela em Colaboradores: aí só a conta Claude com esse e-mail consegue usar aquele nome. Se alguém escolher o nome errado, use <b>Desvincular</b> na tabela acima.</p>
    <p class="notice" style="margin-top:12px"><span><b>Alguém não consegue entrar?</b> Contas com acesso só de leitura (adicionadas como Leitor, ou de fora da organização da Boltz no Claude) não conseguem se vincular. A pessoa vê a tela “Falta liberar sua conta” com o e-mail dela: adicione esse e-mail como <b>Colaborador</b> no compartilhamento. Se for uma conta pessoal, de fora da organização, ela precisa entrar na organização da Boltz no Claude.</span></p></div></div>`;
  return head + pedidos + tabela + ajuda;
}

/* ---------- Marca → Contrato e financeiro: equipe do contrato (só admin edita) ---------- */
function tabelaEquipeContrato(lista, mes, { admin = false, eu = "" } = {}) {
  const vig = a => `${labelMesC(a.desde)} → ${a.ate ? labelMesC(a.ate) : (a.fim ? `${labelMesC(ymOf(a.fim))}` : "sem prazo")}`;
  const ativos = lista.filter(a => alocAtiva(a, mes)); const total = soma(ativos, a => alocValorEm(a, mes));
  return `<div class="tw"><table class="t"><thead><tr><th>Colaborador</th><th class="num">Valor mensal</th><th class="num">Percentual</th><th class="num">Em ${labelMesC(mes)}</th><th>Vigência</th>${admin ? "<th></th>" : ""}</tr></thead><tbody>
    ${lista.map(a => { const on = alocAtiva(a, mes); const u = getUser(a.userId); return `<tr class="${on ? "" : "muted"} ${eu && a.userId === eu ? "eu" : ""}"><td><div class="mname">${avatar(u || { nome: a.nome || "?" })}<div><b>${esc(u?.nome || a.nome || "—")}${eu && a.userId === eu ? " (você)" : ""}</b>${a.obs ? `<small>${esc(a.obs)}</small>` : ""}</div></div></td>
      <td class="num">${fixoTxt(a)}</td><td class="num">${pctTxt(a)}</td><td class="num">${on ? `<b>${fmtBRL(alocValorEm(a, mes))}</b>` : "—"}</td><td>${vig(a)}</td>
      ${admin ? `<td class="num"><div class="row-acts"><button class="btn sm" data-act="aloc-alterar" data-id="${a.id}" title="Novo valor a partir de um mês, mantendo o histórico">Alterar valor</button><button class="icon-btn" data-act="aloc-editar" data-id="${a.id}" title="Editar">${IC.edit}</button><button class="icon-btn del" data-act="aloc-excluir" data-id="${a.id}" title="Excluir">${IC.trash}</button></div></td>` : ""}</tr>`; }).join("")}
    </tbody><tfoot><tr><td>Total em ${labelMesC(mes)}</td><td></td><td></td><td class="num">${fmtBRL(total)}</td><td></td>${admin ? "<td></td>" : ""}</tr></tfoot></table></div>`;
}
function cardEquipeContrato(m, c, mes) {
  const lista = (c.equipe || []).map(a => ({ ...a, contratoId: c.id, inicio: c.inicio, fim: c.fim || "" })).sort((a, b) => nomeResp(a.userId).localeCompare(nomeResp(b.userId)) || (a.desde < b.desde ? -1 : 1));
  const custo = soma(lista, a => alocValorEm(a, mes)); const parte = financeiro(m.id, mes).parte;
  return `<div class="card" style="margin-top:16px"><div class="card-h"><h2>Equipe do contrato <span class="sub">valor mensal e/ou percentual do contrato. Cada colaborador vê os colegas do mesmo contrato.</span></h2><button class="btn sm primary" data-act="aloc-nova" data-id="${m.id}">${IC.plus}Colaboradores</button></div>
    ${lista.length ? tabelaEquipeContrato(lista, mes, { admin: true }) + `<div class="card-b small muted ctr-saldo">Minha participação ${fmtBRL(parte)} − equipe do contrato ${fmtBRL(custo)} = <b class="${parte - custo < 0 ? "neg" : ""}">${fmtBRL(parte - custo)}</b> em ${labelMesC(mes)}. O percentual é calculado sobre o valor do contrato no mês (contrato anual = 1/12 por mês). Tudo entra no total a receber de cada pessoa, na linha "Contratos de marcas".</div>`
      : emptyState("Nenhum colaborador neste contrato", "Adicione quem trabalha nesta marca e quanto recebe por ela: valor mensal, valor anual ou percentual. O valor entra automaticamente no financeiro da pessoa.")}</div>`;
}
function findAloc(id) { for (const c of S.core.contratos) { const a = (c.equipe || []).find(x => x.id === id); if (a) return { a, c }; } return null; }
function alocSobrepoe(c, novo) {
  return (c.equipe || []).some(x => x.id !== novo.id && x.userId === novo.userId && !(novo.ate && novo.ate < x.desde) && !(x.ate && x.ate < novo.desde));
}
function formAloc(o = {}) {
  const f = o.id ? findAloc(o.id) : null; const c = f ? f.c : getContrato(o.marcaId); if (!c) return;
  const a = f?.a; const alterar = !!o.alterar && a;
  const iniC = ymOf(c.inicio); const desde0 = alterar ? (UI.mes > a.desde ? UI.mes : addMonths(a.desde, 1)) : a?.desde || (UI.mes >= iniC ? UI.mes : iniC);
  const titulo = alterar ? `Alterar valor de ${nomeResp(a.userId)}` : a ? "Editar colaborador do contrato" : "Adicionar colaborador ao contrato";
  const v0 = a && !alterar && alocFixoMes(a) ? brl(alocFixoMes(a)) : ""; const p0 = a && !alterar && num(a.pct) ? String(a.pct).replace(".", ",") : "";
  const camposValor = `
      ${fld("Valor mensal (R$)", inp("valor", v0, 'inputmode="decimal" placeholder="0,00"'))}
      ${fld("Percentual do contrato (%)", inp("pct", p0, 'inputmode="decimal" placeholder="0"'), { hint: a?.base === "participacao" ? "Este registro usa a participação da agência como base." : "Calculado sobre o valor do contrato no mês." })}`;
  const body = alterar ? `<div class="form">
      <div class="full notice">Atual: <b>${esc(alocDesc(a))}</b> desde ${labelMes(a.desde)}. O novo valor vale a partir do mês escolhido; os meses anteriores ficam como estão.</div>
      ${camposValor}
      ${fld("A partir de", inp("desde", desde0, 'type="month" required'), { full: true })}
    </div>` : `<div class="form">
      ${fld("Colaborador", sel("userId", [["", "Selecione"], ...usuariosAtivos().map(u => [u.id, u.nome])], a?.userId || "", "required"), { full: true })}
      ${camposValor}
      ${fld("A partir de", inp("desde", desde0, 'type="month" required'))}
      ${fld("Até (opcional)", inp("ate", a?.ate || "", 'type="month"'), { hint: c.fim ? `Sem data, vale até o fim do contrato (${labelMes(ymOf(c.fim))}).` : "Sem data, vale enquanto o contrato estiver ativo." })}
      ${fld("Observação", inp("obs", a?.obs || "", 'placeholder="Ex.: social media da marca"'), { full: true })}
    </div>`;
  openModal({ title: titulo, sub: esc(nomeMarca(c.marcaId)), body,
    foot: `<span class="left"></span><button type="button" class="btn" data-act="close-modal">Cancelar</button><button type="submit" class="btn primary">Salvar</button>`,
    onSubmit: d => {
      const v = num(d.valor), pc = num(d.pct);
      if (!(v > 0) && !(pc > 0)) { toast("Preencha o valor mensal, o percentual, ou os dois."); return false; }
      if (pc > 100) { toast("O percentual passa de 100%."); return false; }
      if (!/^\d{4}-\d{2}$/.test(d.desde || "")) { toast("Informe o mês de início."); return false; }
      const vals = { forma: "mensal", valor: v > 0 ? v : 0, pct: pc > 0 ? pc : 0, base: pc > 0 ? (a?.base === "participacao" && !alterar ? "participacao" : "contrato") : "" };
      c.equipe ||= [];
      if (alterar) {
        if (d.desde <= a.desde) Object.assign(a, vals);
        else {
          const novo = { id: uid("ce"), userId: a.userId, ...vals, desde: d.desde, ate: a.ate && a.ate >= d.desde ? a.ate : "", obs: a.obs || "", criadoEm: TODAY, criadoPor: SESSION.userId };
          a.ate = addMonths(d.desde, -1); c.equipe.push(novo);
        }
      } else {
        if (!getUser(d.userId)) { toast("Escolha o colaborador."); return false; }
        if (d.ate && d.ate < d.desde) { toast("O mês final é anterior ao inicial."); return false; }
        const novo = { ...(a || { id: uid("ce"), criadoEm: TODAY, criadoPor: SESSION.userId }), userId: d.userId, ...vals, desde: d.desde, ate: d.ate || "", obs: (d.obs || "").trim() };
        if (alocSobrepoe(c, novo)) { toast(`${nomeResp(d.userId)} já está neste contrato nesse período. Use "Alterar valor" para mudar a partir de um mês.`); return false; }
        if (a) Object.assign(a, novo); else c.equipe.push(novo);
      }
      Repo.touch("core"); render();
      toast(alterar ? "Novo valor registrado." : a ? "Colaborador do contrato atualizado." : `${nomeResp(d.userId)} adicionado ao contrato.`);
    } });
}

/* ---------- Caixa "Equipe do contrato" com todos os colaboradores (criar contrato / adicionar vários) ---------- */
function equipeBoxHTML(c = null, desde = "") {
  const ocupado = u => !!(c && desde && (c.equipe || []).some(x => x.userId === u.id && (!x.ate || x.ate >= desde)));
  const lista = usuariosAtivos().slice().sort((a, b) => (a.papel !== b.papel ? (a.papel === "colaborador" ? -1 : 1) : a.nome.localeCompare(b.nome)));
  return `<div class="full eqbox" role="group" aria-label="Equipe do contrato">
    <div class="eq-head"><span>Colaborador</span><span>Valor mensal (R$)</span><span>Percentual (%)</span></div>
    ${lista.map(u => { const occ = ocupado(u); return `<div class="eq-row ${occ ? "occ" : ""}" data-uid="${u.id}">
      <label class="eq-chk"><input type="checkbox" name="eq_on_${u.id}" ${occ ? "disabled" : ""}>${avatar(u)}<span><b>${esc(u.nome)}</b>${occ ? "<small>já está neste contrato</small>" : u.funcao ? `<small>${esc(u.funcao)}</small>` : ""}</span></label>
      <div class="eq-in"><span>R$</span><input name="eq_valor_${u.id}" inputmode="decimal" placeholder="0,00" aria-label="Valor mensal de ${esc(u.nome)}" ${occ ? "disabled" : ""}></div>
      <div class="eq-in"><input name="eq_pct_${u.id}" inputmode="decimal" placeholder="0" aria-label="Percentual de ${esc(u.nome)}" ${occ ? "disabled" : ""}><span>%</span></div>
    </div>`; }).join("")}
    <p class="small muted eq-hint">Marque quem atua nesta marca. Preencha o valor mensal, o percentual do contrato, ou os dois (eles se somam). O percentual é calculado sobre o valor do contrato de cada mês.</p>
  </div>`;
}
function montarEquipeBox(form) {
  const box = form.querySelector(".eqbox"); if (!box) return;
  const marca = row => row.classList.toggle("on", row.querySelector('input[type="checkbox"]').checked);
  box.querySelectorAll(".eq-row").forEach(marca);
  box.addEventListener("input", e => { const row = e.target.closest(".eq-row"); if (!row) return; if (/^eq_(valor|pct)_/.test(e.target.name || "") && e.target.value.trim()) row.querySelector('input[type="checkbox"]').checked = true; marca(row); });
  box.addEventListener("change", e => { const row = e.target.closest(".eq-row"); if (row) marca(row); });
}
/** lê a caixa; devolve { itens } ou { erro } */
function lerEquipeBox(d, desde, ate = "") {
  const itens = [];
  for (const u of usuariosAtivos()) {
    if (d["eq_on_" + u.id] !== "on") continue;
    const v = num(d["eq_valor_" + u.id]), p = num(d["eq_pct_" + u.id]);
    if (!(v > 0) && !(p > 0)) return { erro: `Preencha o valor mensal ou o percentual de ${u.nome}, ou desmarque.` };
    if (p > 100) return { erro: `O percentual de ${u.nome} passa de 100%.` };
    itens.push({ id: uid("ce"), userId: u.id, forma: "mensal", valor: v > 0 ? v : 0, pct: p > 0 ? p : 0, base: "contrato", desde, ate, obs: "", criadoEm: TODAY, criadoPor: SESSION.userId });
  }
  return { itens };
}
/** botão "+ Colaboradores" do cartão: adiciona vários de uma vez */
function formAlocVarios(marcaId) {
  const c = getContrato(marcaId); if (!c) return;
  const iniC = ymOf(c.inicio); const desde0 = UI.mes >= iniC ? UI.mes : iniC;
  openModal({ title: "Adicionar colaboradores ao contrato", sub: esc(nomeMarca(marcaId)), cls: "wide",
    body: `<div class="form">${fld("A partir de", inp("desde", desde0, 'type="month" required'))}${fld("Até (opcional)", inp("ate", "", 'type="month"'), { hint: "Sem data, vale enquanto o contrato estiver ativo." })}<h5>Equipe</h5>${equipeBoxHTML(c, desde0)}</div>`,
    foot: `<span class="left"></span><button type="button" class="btn" data-act="close-modal">Cancelar</button><button type="submit" class="btn primary">Adicionar</button>`,
    onMount: form => montarEquipeBox(form),
    onSubmit: d => {
      if (!/^\d{4}-\d{2}$/.test(d.desde || "")) { toast("Informe o mês de início."); return false; }
      if (d.ate && d.ate < d.desde) { toast("O mês final é anterior ao inicial."); return false; }
      const r = lerEquipeBox(d, d.desde, d.ate || ""); if (r.erro) { toast(r.erro); return false; }
      if (!r.itens.length) { toast("Marque pelo menos um colaborador."); return false; }
      c.equipe ||= [];
      const conflito = r.itens.find(x => alocSobrepoe(c, x)); if (conflito) { toast(`${nomeResp(conflito.userId)} já está neste contrato nesse período.`); return false; }
      c.equipe.push(...r.itens); Repo.touch("core"); render();
      toast(`${r.itens.length} ${r.itens.length === 1 ? "colaborador adicionado" : "colaboradores adicionados"} ao contrato.`);
    } });
}

      : emptyState("Sem contratos vinculados", adminView ? "Vincule esta pessoa a um contrato em Marcas → Contrato e financeiro." : "Quando você for vinculado a um contrato de marca, o valor aparece aqui.")}</div>`;
}

/* ---------- Página pública de contratos (pub/contratos): o que a equipe pode ver em Marcas ----------
   Nome, status, vigência, contrato assinado (PDF) e a equipe de cada contrato com valores e percentuais.
   Valor total do contrato, participação e recebimentos continuam só para administradores. */
function projecaoContratos() {
  return { marcas: S.core.marcas.map(m => { const c = getContrato(m.id);
    return { id: m.id, nome: m.nome, status: m.status, categoria: m.categoria || "",
      contrato: c ? { inicio: c.inicio, fim: c.fim || "", pdf: c.pdf ? { nome: c.pdf.nome, url: c.pdf.url || "", id: c.pdf.id || "", dataUrl: c.pdf.dataUrl || "", enviadoEm: c.pdf.enviadoEm || "" } : null } : null,
      contratoId: c ? c.id : "" }; }) };
}
/** membros de um contrato com valores calculados (o que um colega do mesmo contrato pode ver) */
function equipeCalculada(c) { return (c.equipe || []).map(a => { const x = { ...a, contratoId: c.id, inicio: c.inicio, fim: c.fim || "" }; return { ...x, nome: nomeResp(a.userId), valores: alocValores(x) }; }); }
function marcasPublicas() {
  const adm = SESSION.mode === "local" || realUser()?.papel === "admin";
  const base = adm ? projecaoContratos().marcas : (S.pubContratos?.marcas || []);
  return base.map(m => {
    let equipe = [];
    if (m.contratoId) {
      if (adm) { const c = S.core.contratos.find(x => x.id === m.contratoId); equipe = c ? equipeCalculada(c) : []; }
      else equipe = (S.equipe.equipesContratos || {})[m.contratoId] || [];
    }
    if (!isAdmin()) { const eu = me()?.id; if (!equipe.some(a => a.userId === eu)) equipe = []; }
    return { ...m, equipe };
  });
}
async function escreverPubContratos() {
  const doc = projecaoContratos(); const sig = JSON.stringify(doc);
  if (Repo.pubContratosLast === sig) return;
  await Repo.be.set("pub/contratos", { ...doc, atualizadoEm: new Date().toISOString() }); Repo.pubContratosLast = sig;
}
const pdfUrl = p => p ? (p.url || (p.id ? "/_blob/" + p.id : p.dataUrl || "")) : "";

/* ---------- Colaborador: Marcas (somente leitura) ---------- */
function viewMarcasColab() {
  const mes = UI.mes; const eu = me().id; const lista = marcasPublicas();
  const sel = UI.marcaId && lista.find(m => m.id === UI.marcaId);
  if (sel) {
    const m = sel; const c = m.contrato; const eq = m.equipe.slice().sort((a, b) => (b.userId === eu) - (a.userId === eu) || String(a.nome).localeCompare(String(b.nome)));
    return `<button class="back" data-act="voltar-marcas">${IC.left}Marcas</button>
      <div class="brand-head">${logoHTML({ nome: m.nome }, true)}<div><h1>${esc(m.nome)}</h1><div class="meta">${badge(MARCA_ST[m.status]?.label || m.status, MARCA_ST[m.status]?.cls || "b-gray")}<span>${esc(m.categoria || "Sem categoria")}</span></div></div></div>
      <div class="grid g2" style="margin-bottom:16px"><div class="card"><div class="card-h"><h2>Contrato</h2></div><div class="card-b">${c ? `<dl class="dl"><dt>Início</dt><dd>${fmtDataL(c.inicio)}</dd><dt>Término</dt><dd>${c.fim ? fmtDataL(c.fim) : "Indeterminado"}</dd><dt>Contrato assinado</dt><dd>${c.pdf ? `<a class="cheque-link" href="${esc(pdfUrl(c.pdf))}" target="_blank" rel="noopener">${IC.doc}<span>${esc(c.pdf.nome || "Abrir PDF")}</span></a>` : `<span class="muted">Ainda não anexado</span>`}</dd></dl>` : `<p class="muted" style="margin:0">Sem contrato cadastrado.</p>`}</div></div>

async function anexarPdfContrato(marcaId, file) {

/* ---------- Home Office: votação semanal ----------
   Toda sexta às 10h abre a votação da semana seguinte (segunda a sexta). Cada pessoa escolhe 1 dia.
   Votos: hovoto/{conta} = { userId, semanas: { "AAAA-MM-DD (segunda)": { dia, em } } }  (cada um grava só o seu; todos leem)
   Em tempo real: uma assinatura da coleção por sessão. Configuração (limite por dia, abertura manual): pub/dir.homeOffice. */
const HO = { docs: {}, pronto: false, unsub: null };
const DIAS_LONGOS = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
const hoCfg = () => ({ limite: 2, abertas: [], ...(S.dir.homeOffice || {}) });
function segundaDe(iso) { const d = parseD(iso).getDay(); return addDays(iso, -((d + 6) % 7)); }
const semanaAtual = () => segundaDe(TODAY);
const semanaAlvo = () => addDays(semanaAtual(), 7);
const diasDaSemana = seg => [0, 1, 2, 3, 4].map(i => addDays(seg, i));
function aberturaDe(seg) { const d = parseD(addDays(seg, -3)); return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 10, 0, 0); }
function fechamentoDe(seg) { const d = parseD(seg); return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, 0, 0); }
function estadoHO(seg) {
  const agora = Date.now();
  if (agora >= fechamentoDe(seg).getTime()) return "encerrada";
  if (agora >= aberturaDe(seg).getTime() || hoCfg().abertas.includes(seg)) return "aberta";
  return "aguardando";
}
const hoBase = u => cidDe(u) || `sc~${u.id}`;
function hoUserDaBase(base) { return S.dir.usuarios.find(u => cidDe(u) === base) || (base.startsWith("sc~") ? getUser(base.slice(3)) : null); }
/** votos da semana: [{ userId, dia, em, base }] — um por pessoa (o mais recente) */
function votosHO(seg) {
  const porUser = {};
  for (const [base, d] of Object.entries(HO.docs)) {
    const u = hoUserDaBase(base); const v = d?.semanas?.[seg]; if (!u || !v?.dia) continue;
    if (!porUser[u.id] || String(v.em) > String(porUser[u.id].em)) porUser[u.id] = { userId: u.id, dia: v.dia, em: v.em || "", base };
  }
  return Object.values(porUser);
}
const participantesHO = () => S.dir.usuarios.filter(u => u.ativo).sort((a, b) => (a.papel !== b.papel ? (a.papel === "colaborador" ? -1 : 1) : a.nome.localeCompare(b.nome)));
function iniciarHomeOffice() {
  if (HO.unsub) return;
  const aplicar = docs => { HO.docs = Object.fromEntries(docs.map(d => [d.id, d.data])); HO.pronto = true; if (SESSION.userId && UI.view === "homeoffice" && !$("#mform")) render(); };
  if (Repo.be.watch) HO.unsub = Repo.be.watch("hovoto", aplicar, () => { HO.unsub = null; });
  else Repo.be.list("hovoto").then(aplicar).catch(() => { HO.pronto = true; });
}
async function recarregarHO() { try { const docs = await Repo.be.list("hovoto"); HO.docs = Object.fromEntries(docs.map(d => [d.id, d.data])); HO.pronto = true; } catch (_) { } }
async function gravarVotoHO(u, seg, dia) {
  const base = hoBase(u); const atual = clone(HO.docs[base] || { userId: u.id, semanas: {} });
  atual.userId = u.id; atual.semanas ||= {};
  if (dia) atual.semanas[seg] = { dia, em: new Date().toISOString(), por: SESSION.userId }; else delete atual.semanas[seg];
  // só guarda semanas recentes
  Object.keys(atual.semanas).forEach(k => { if (k < addDays(semanaAtual(), -56)) delete atual.semanas[k]; });
  await Repo.be.set("hovoto/" + base, atual); HO.docs[base] = atual;
}
async function votarHO(dia, paraId) {
  const seg = semanaAlvo(); const admin = isAdmin() && !SESSION.viewAs;
  const u = paraId && admin ? getUser(paraId) : me(); if (!u || SESSION.viewAs) return;
  if (estadoHO(seg) !== "aberta" && !admin) { toast("A votação desta semana ainda não está aberta."); return; }
  const lim = num(hoCfg().limite);
  const outros = votosHO(seg).filter(v => v.dia === dia && v.userId !== u.id);
  if (dia && lim && outros.length >= lim && !admin) { toast(`${DIAS_LONGOS[parseD(dia).getDay()]} já está lotada. Escolha outro dia.`); return; }
  try { await gravarVotoHO(u, seg, dia); } catch (_) { toast("Não foi possível salvar o voto. Verifique sua conexão."); return; }
  render();
  if (dia && lim && !admin) {
    // confere corrida: se alguém pegou a última vaga um instante antes, desfaz
    await recarregarHO();
    const doDia = votosHO(seg).filter(v => v.dia === dia).sort((a, b) => String(a.em).localeCompare(String(b.em)));
    if (doDia.findIndex(v => v.userId === u.id) >= lim) { await gravarVotoHO(u, seg, ""); render(); toast(`Alguém escolheu ${DIAS_LONGOS[parseD(dia).getDay()]} um instante antes e o dia lotou. Escolha outro.`); return; }
  }
  toast(dia ? (u.id === me().id ? `Seu home office: ${DIAS_LONGOS[parseD(dia).getDay()].toLowerCase()}, ${fmtDataL(dia).slice(0, 5)}.` : `${u.nome}: ${DIAS_LONGOS[parseD(dia).getDay()].toLowerCase()}, ${fmtDataL(dia).slice(0, 5)}.`) : "Voto removido.");
}
function tempoAte(dt) {
  const ms = dt.getTime() - Date.now(); if (ms <= 0) return "agora";
  const h = Math.floor(ms / 3600000), d = Math.floor(h / 24), m = Math.floor((ms % 3600000) / 60000);
  return d ? `${d} ${d === 1 ? "dia" : "dias"} e ${h % 24}h` : h ? `${h}h${String(m).padStart(2, "0")}` : `${m} min`;
}
function viewHomeOffice() {
  const admin = isAdmin() && !SESSION.viewAs; const eu = me();
  const seg = semanaAlvo(); const st = estadoHO(seg); const cfg = hoCfg(); const lim = num(cfg.limite);
  const dias = diasDaSemana(seg); const votos = votosHO(seg); const meu = votos.find(v => v.userId === eu.id);

    : st === "aguardando"
      ? `<div class="ho-banner wait"><b>Abre sexta, ${fmtDataL(isoOf(abre)).slice(0, 5)}, às 10h</b><span>Faltam ${tempoAte(abre)}. A votação é toda sexta às 10h para a semana seguinte.</span>${admin ? `<button class="btn sm" data-act="ho-abrir">Abrir agora</button>` : ""}</div>`
      : `<div class="ho-banner"><b>Votação encerrada</b></div>`;

    return `<div class="ho-dia ${meuDia ? "meu" : ""} ${cheio ? "cheio" : ""}">
      <div class="ho-dh"><span class="cheque-l">${DIAS_LONGOS[parseD(d).getDay()]}</span><b>${fmtDataL(d).slice(0, 5)}</b><span class="ho-cap">${quem.length}${lim ? `/${lim}` : ""}</span></div>
      <div class="ho-quem">${quem.length ? quem.map(v => `<div class="ho-p ${v.userId === eu.id ? "eu" : ""}">${avatar(getUser(v.userId) || { nome: "?" })}<span>${esc(nomeResp(v.userId))}${v.userId === eu.id ? " (você)" : ""}</span>${admin ? `<button class="icon-btn del" data-act="ho-remover" data-id="${v.userId}" title="Remover voto">${IC.trash}</button>` : ""}</div>`).join("") : `<span class="muted small">Ninguém ainda</span>`}</div>
      <div class="ho-act">${btn}</div></div>`; }).join("")}</div>`;
  const pend = participantesHO().filter(u => !votos.some(v => v.userId === u.id));
  const meuTxt = SESSION.viewAs ? "" : meu ? `<div class="ho-meu">Seu home office na próxima semana: <b>${DIAS_LONGOS[parseD(meu.dia).getDay()].toLowerCase()}, ${fmtDataL(meu.dia).slice(0, 5)}</b>.</div>` : st === "aberta" ? `<div class="ho-meu warn">Você ainda não escolheu seu dia.</div>` : "";

  // semana em curso
  const segA = semanaAtual(); const votosA = votosHO(segA);
  const atual = `<div class="card" style="margin-top:16px"><div class="card-h"><h2>Esta semana <span class="sub">${fmtDataL(segA).slice(0, 5)} a ${fmtDataL(addDays(segA, 4)).slice(0, 5)}</span></h2></div>

/* ---------- Workspace: espaço pessoal de cada pessoa (notas, checklist, calendário) ----------
   Fica em data/users/{conta}/ws/{notas|tarefas|eventos}/{id}: área privada de cada pessoa no banco,
   que nem administradores conseguem ler. Um documento por item, gravado só quando muda. */
const WS = { carregado: false, carregando: false, dono: "", notas: [], tarefas: [], eventos: [], recebidas: [], recSel: null, recUnsubs: [], recPorAutor: {}, ocultas: [], notaSel: null, timers: {}, busca: "", verFeitas: false };
const wsDono = () => SESSION.mode === "conta" ? SESSION.cid : SESSION.userId;
const wsBase = () => `data/users/${wsDono()}/ws`;
async function wsCarregar() {
  if (WS.carregando) return; WS.carregando = true;

    const [n, t, e] = await Promise.all(["notas", "tarefas", "eventos"].map(k => Repo.be.list(`${wsBase()}/${k}`).catch(() => [])));
    Object.assign(WS, { notas: n.map(d => ({ ...d.data, id: d.id })), tarefas: t.map(d => ({ ...d.data, id: d.id })), eventos: e.map(d => ({ ...d.data, id: d.id })), carregado: true, dono });

async function wsGravar(tipo, item) { try { const d = { ...item }; delete d.id; await Repo.be.set(`${wsBase()}/${tipo}/${item.id}`, d); return true; } catch (_) { toast("Não foi possível salvar. Verifique sua conexão."); return false; } }

const agoraIso = () => new Date().toISOString();

/* --- checklist --- */
function wsGrupoTarefa(t) { if (t.feita) return "feitas"; if (!t.data) return "semdata"; if (t.data < TODAY) return "atrasadas"; if (t.data === TODAY) return "hoje"; return "proximas"; }
function wsLinhaTarefa(t) {
  return `<div class="ws-task ${t.feita ? "ok" : ""}"><label><input type="checkbox" data-act="ws-task-toggle" data-id="${t.id}" ${t.feita ? "checked" : ""}><span>${esc(t.texto)}</span></label>

}
function wsChecklist() {

  Object.values(g).forEach(a => a.sort((x, y) => String(x.data || "9").localeCompare(String(y.data || "9")) || String(x.criadoEm).localeCompare(String(y.criadoEm))));

    ${g.feitas.length ? `<div class="ws-gh feitas"><button class="linkbtn" data-act="ws-ver-feitas">${WS.verFeitas ? "Ocultar" : "Mostrar"} concluídas</button> <span>${g.feitas.length}</span>${WS.verFeitas ? `<button class="linkbtn" data-act="ws-limpar-feitas" style="margin-left:auto">Limpar concluídas</button>` : ""}</div>${WS.verFeitas ? g.feitas.map(wsLinhaTarefa).join("") : ""}` : ""}</div></div>`;
}

/* --- calendário pessoal: escolher um dia mostra o painel do dia (tarefas, notas, compromissos) --- */
const wsDataNota = n => n.data || String(n.criadoEm || "").slice(0, 10) || TODAY;
function wsItensDia(d) {
  const ev = WS.eventos.filter(e => e.data === d).sort((a, b) => String(a.hora || "99").localeCompare(String(b.hora || "99")));
  const tf = WS.tarefas.filter(t => t.data === d).sort((a, b) => (a.feita - b.feita) || String(a.criadoEm).localeCompare(String(b.criadoEm)));
  const nt = WS.notas.filter(n => wsDataNota(n) === d).sort((a, b) => String(b.editadoEm).localeCompare(String(a.editadoEm)));
  const voto = votosHO(segundaDe(d)).find(v => v.userId === me().id && v.dia === d);

}
function wsDiaAtual() { if (!WS.diaSel || ymOf(WS.diaSel) !== UI.mes) WS.diaSel = ymOf(TODAY) === UI.mes ? TODAY : dateIn(UI.mes, 1); return WS.diaSel; }
function wsCalendario() {
  const mes = UI.mes; const sel = wsDiaAtual(); const startW = parseD(dateIn(mes, 1)).getDay(); const cells = [];
  for (let i = 0; i < startW; i++) cells.push(addDays(dateIn(mes, 1), i - startW));

/* ---------- Reuniões: pedido → aceitar / recusar (com motivo e sugestão de novo horário) ----------
   Pedido:   reunioes/{conta do autor}/itens/{id}  = { autorId, convidados, data, hora, duracao, assunto, descricao, local, versao, status, aceitosAuto }
   Resposta: respostas/{conta de quem responde}/itens/{autorConta_id} = { resposta, motivo, sugData, sugHora, versao, em }
   Cada pessoa grava só na própria pasta; o app mostra a reunião só para quem participa. Tempo real por assinatura. */
const RN = { reun: {}, resp: {}, unsubs: [], pronto: false, aba: "pendentes" };
function iniciarReunioes() {
  if (RN.unsubs.length || !Repo.be.watch && RN.pronto) return;
  const atualizar = () => { RN.pronto = true; rnBadge(); if (SESSION.userId && UI.view === "reunioes" && !$("#mform")) render(); };
  S.dir.usuarios.filter(u => u.ativo && cidDe(u)).forEach(u => {
    const cid = cidDe(u);
    const recR = docs => { RN.reun[cid] = docs.map(d => ({ ...d.data, id: d.id, key: `${cid}_${d.id}`, autorCid: cid })).filter(r => r.autorId === u.id); atualizar(); };
    const recA = docs => { RN.resp[cid] = docs.map(d => ({ ...d.data, key: d.id, userId: u.id })); atualizar(); };
    if (Repo.be.watch) { RN.unsubs.push(Repo.be.watch(`reunioes/${cid}/itens`, recR, () => { })); RN.unsubs.push(Repo.be.watch(`respostas/${cid}/itens`, recA, () => { })); }
    else { Repo.be.list(`reunioes/${cid}/itens`).then(recR).catch(() => { }); Repo.be.list(`respostas/${cid}/itens`).then(recA).catch(() => { }); }
  });
}
const rnTodas = () => Object.values(RN.reun).flat();
const rnMinhas = () => { const eu = me().id; return rnTodas().filter(r => r.autorId === eu || (r.convidados || []).includes(eu)); };
function rnResposta(r, userId) {
  if (r.aceitosAuto && r.aceitosAuto[userId] === r.versao) return { resposta: "aceita", auto: true };

function rnStatus(r) {

const RN_ST = { confirmada: ["Confirmada", "b-green"], aguardando: ["Aguardando respostas", "b-yellow"], recusa: ["Com recusa", "b-red"], cancelada: ["Cancelada", "b-gray"] };
function rnPendentesParaMim() { const eu = me().id; return rnMinhas().filter(r => r.status !== "cancelada" && !rnPassou(r) && (r.convidados || []).includes(eu) && (() => { const x = rnResposta(r, eu); return !x || x.antiga; })()); }
function rnBadge() { const b = document.querySelector('#nav [data-view="reunioes"]'); if (!b) return; b.querySelector(".count")?.remove(); const n = SESSION.userId ? rnPendentesParaMim().length : 0; if (n) b.insertAdjacentHTML("beforeend", `<span class="count">${n}</span>`); }
const rnQuando = r => `${DIAS_LONGOS[parseD(r.data).getDay()]}, ${fmtDataL(r.data).slice(0, 5)} às ${r.hora}${r.duracao ? ` · ${r.duracao} min` : ""}`;

function rnCard(r) {
  const eu = me().id; const autor = r.autorId === eu; const st = rnStatus(r); const minha = rnResposta(r, eu);
  const pessoas = (r.convidados || []).map(u => { const x = rnResposta(r, u);
    const tag = !x || x.antiga ? `<span class="rn-st wait">⏳ aguardando</span>` : x.resposta === "aceita" ? `<span class="rn-st ok">✓ aceitou</span>` : `<span class="rn-st no">✕ recusou</span>`;

      <div class="apv-val"><b>${fmtBRL(r.v)}</b></div>
      <div class="apv-acts"><button class="btn sm danger" data-act="rb-recusar" data-uid="${r.pid}" data-id="${r.id}">Recusar</button><button class="btn sm primary" data-act="rb-aprovar" data-uid="${r.pid}" data-id="${r.id}">${IC.check}Aprovar</button></div></div>`; }).join("")}</div>`;

/* ---------- Troca de conta: quando alguém passa a entrar com outra conta Claude, os dados vão junto ----------
   (o que fica na área privada da conta antiga, como o Workspace, só a própria conta antiga consegue ler) */
async function migrarConta(u, velho, novo) {
  if (!velho || !novo || velho === novo || SESSION.mode !== "conta") return;
  const be = Repo.be; let n = 0;
  const mover = async (de, para) => { try { const d = await be.get(de); if (d) { await be.set(para, d); await be.del(de); n++; } } catch (_) { } };
  const moverCol = async (de, para) => { try { for (const d of await be.list(de)) { await be.set(`${para}/${d.id}`, d.data); await be.del(`${de}/${d.id}`); n++; } } catch (_) { } };
  toast(`Trazendo os dados de ${u.nome} para a nova conta…`);
  let m = addMonths(S.core.inicioUso || CUR, -2); const fim = addMonths(CUR, 3);
  for (; m <= fim; m = addMonths(m, 1)) await moverCol(`ativ/${velho}/${m}`, `ativ/${novo}/${m}`);
  for (const k of ["flashz", "hovoto"]) await mover(`${k}/${velho}`, `${k}/${novo}`);
  for (const [col, sub] of [["notacomp", "notas"], ["reunioes", "itens"], ["respostas", "itens"], ["msgs", "m"], ["grupos", "g"], ["envios", "itens"]]) await moverCol(`${col}/${velho}/${sub}`, `${col}/${novo}/${sub}`);
  // respostas de outras pessoas a reuniões que ela criou, e mensagens dos grupos que ela criou
  const outros = S.dir.usuarios.filter(x => x.claudeId && x.id !== u.id).map(x => x.claudeId).concat(novo);
  for (const c of outros) {
    try { for (const d of await be.list(`respostas/${c}/itens`)) if (d.id.startsWith(velho + "_")) { await be.set(`respostas/${c}/itens/${novo}_${d.id.slice(velho.length + 1)}`, d.data); await be.del(`respostas/${c}/itens/${d.id}`); n++; } } catch (_) { }
    try { for (const d of await be.list(`msgs/${c}/m`)) if (String(d.data.conv || "").startsWith(`gr_${velho}_`)) { await be.set(`msgs/${c}/m/${d.id}`, { ...d.data, conv: `gr_${novo}_` + d.data.conv.slice(`gr_${velho}_`.length) }); n++; } } catch (_) { }
  }
  for (const k of ["fin", "cred"]) { try { await be.del(`${k}/${velho}`); } catch (_) { } }
  delete u.claudeIdAnterior; Repo.touch("dir"); S.ativ = {};
  toast(`Pronto: ${n} ${n === 1 ? "registro de" : "registros de"} ${u.nome} foram para a nova conta.`);
}

  const max = Math.max(1, ...dados.map(d => d.total));
