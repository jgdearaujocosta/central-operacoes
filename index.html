    ${S.dir.categorias.map(x => `<div class="row" style="padding:8px 4px"><div class="field" style="flex:1"><input value="${esc(x.nome)}" data-change="rename-cat" data-id="${x.id}" aria-label="Nome"></div><button class="icon-btn" data-act="del-cat" data-id="${x.id}" title="Excluir">${IC.trash}</button></div>`).join("")}</div></div>`;
  const acesso = SESSION.mode === "conta"
    ? `<div class="notice">${IC.lock}<span>Cada pessoa entra com a própria conta Claude e uma senha pessoal, criada no primeiro acesso. Os valores de um colaborador ficam num espaço que só ele e os admins conseguem ler, garantido pelo servidor. Para dar acesso: compartilhe este app com Isabella e Duda como <b>Editor</b> e com os colaboradores como <b>Colaborador (Contributor)</b>. Na primeira visita, a pessoa digita o próprio nome e cria a senha; se o nome não existir, o cadastro é criado sozinho como Colaborador.</span></div>`
    : `<div class="notice">${IC.lock}<span>Modo navegador: os dados ficam neste dispositivo e cada usuário entra com a própria senha. Para uso em equipe com privacidade real, abra o app publicado no Claude; cada pessoa entra com a própria conta.</span></div>`;
  return pageHead("Configurações", "Tabela de valores, categorias, acesso e dados") +
    `<div class="stack">${tipos}<div class="grid g2">${cats}<div class="card"><div class="card-h"><h2>Acesso e dados</h2></div><div class="card-b stack">${acesso}
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="backup">${IC.dl}Baixar backup (JSON)</button><label class="btn" style="cursor:pointer">Importar backup<input type="file" accept="application/json,.json" data-change="import" hidden></label><button class="btn danger" data-act="zerar">Apagar todos os dados</button></div>
      <div class="field" style="max-width:280px"><label>Tema</label><div class="selw"><select data-change="tema"><option value="">Automático</option><option value="light" ${document.documentElement.dataset.theme === "light" ? "selected" : ""}>Claro</option><option value="dark" ${document.documentElement.dataset.theme === "dark" ? "selected" : ""}>Escuro</option></select></div></div>
    </div></div></div></div>`;
}
</script>
<script>
"use strict";
/* ---------- Render ---------- */
const VIEW_FN = { painel: () => viewPainel(), marcas: () => viewMarcas(), demandas: () => viewDemandas(), calendario: () => viewCalendario(), colaboradores: () => viewColaboradores(), aprovacoes: () => viewAprovacoes(), pagamentos: () => viewPagamentos(), relatorios: () => viewRelatorios(), configuracoes: () => viewConfig(), meu: () => viewMeu(), agenda: () => viewAtividades(true), atividades: () => viewAtividades(false), acessos: () => viewAcessos(), homeoffice: () => viewHomeOffice(), workspace: () => viewWorkspace(), reunioes: () => viewReunioes(), chat: () => viewChat(), trabalhos: () => viewTrabalhos(), meufin: () => viewMeuFin(), reembolsos: () => viewReembolsos(), historico: () => viewHistorico() };
function render() {
  if (!SESSION.userId || !me()) return;
  TODAY = isoOf(new Date()); CUR = ymOf(TODAY);
  const permitidas = isAdmin() ? VIEWS_ADMIN.map(v => v[0]) : viewsColab().map(v => v[0]);
  if (!permitidas.includes(UI.view)) UI.view = isAdmin() ? "painel" : "meu";
  if (UI.view === "marcas" && UI.marcaId && !(isAdmin() ? getMarca(UI.marcaId) : marcasPublicas().some(m => m.id === UI.marcaId))) UI.marcaId = null;
  if (UI.view === "colaboradores" && UI.colabId && !getUser(UI.colabId)) UI.colabId = null;
  document.body.classList.toggle("is-colab", !isAdmin());
  renderShell();
  $("#view").innerHTML = VIEW_FN[UI.view]();
  document.title = `Central de Operação, ${labelMes(UI.mes)}`;
  if (UI.view === "chat") chPosRender();
}
function setMes(m) { UI.mes = m; ensureMonth(m); render(); }

/* ---------- Toast e modal ---------- */
function toast(msg, undo) {
  const el = document.createElement("div"); el.className = "toast";
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">Desfazer</button>' : ""}`;
  if (undo) el.querySelector("button").onclick = () => { undo(); el.remove(); };
  $("#toasts").appendChild(el); setTimeout(() => el.remove(), undo ? 6000 : 3400);
}
function openModal({ title, sub = "", body, foot = "", cls = "", onSubmit, onMount }) {
  closeModal();
  $("#modalRoot").innerHTML = `<div class="overlay" data-overlay><form class="modal ${cls}" id="mform" role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <div class="modal-h"><div><h3 id="mtitle">${esc(title)}</h3>${sub ? `<p>${sub}</p>` : ""}</div><button type="button" class="icon-btn" data-act="close-modal" aria-label="Fechar">${IC.x}</button></div>
    <div class="modal-b">${body}</div>${foot ? `<div class="modal-f">${foot}</div>` : ""}</form></div>`;
  const form = $("#mform");
  form.addEventListener("submit", async e => { e.preventDefault(); const data = Object.fromEntries(new FormData(form)); const r = onSubmit ? await onSubmit(data, form) : true; if (r !== false) closeModal(); });
  const first = form.querySelector(".modal-b input:not([type=hidden]):not([type=file]):not([disabled]), .modal-b select:not([disabled]), .modal-b textarea");
  if (first && window.matchMedia("(min-width: 861px)").matches) first.focus();
  if (onMount) onMount(form);
}
function closeModal() { $("#modalRoot").innerHTML = ""; }
function confirmModal(title, text, label, fn, danger = true) {
  openModal({ title, body: `<p style="margin:0;color:var(--ink-2)">${text}</p>`, foot: `<button type="button" class="btn" data-act="close-modal">Voltar</button><button type="submit" class="btn ${danger ? "danger" : "primary"}">${esc(label)}</button>`, onSubmit: () => fn() });
}
const fld = (label, control, { full = false, hint = "" } = {}) => `<div class="field ${full ? "full" : ""}"><label>${label}</label>${control}${hint ? `<span class="hint">${hint}</span>` : ""}</div>`;
const inp = (name, value = "", attrs = "") => `<input name="${name}" value="${esc(value)}" ${attrs}>`;
const ta = (name, value = "", attrs = "") => `<textarea name="${name}" ${attrs}>${esc(value)}</textarea>`;
const sel = (name, opts, value = "", attrs = "") => `<div class="selw"><select name="${name}" ${attrs}>${opts.map(([k, l]) => `<option value="${esc(k)}" ${String(k) === String(value) ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></div>`;
const respOpts = (vazio = true) => [...(vazio ? [["", "Sem responsável"]] : []), ...usuariosAtivos().map(r => [r.id, r.nome])];
const catOpts = () => [["", "Sem categoria"], ...S.dir.categorias.map(c => [c.id, c.nome])];
function mesOpts(from, to) { const out = []; for (let k = from; k <= to && out.length < 200; k = addMonths(k, 1)) out.push([k, labelMes(k)]); return out; }
const brl = v => v ? String(v).replace(".", ",") : "";
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function flushNow() { clearTimeout(Repo.timer); while (Repo.busy) await sleep(40); await Repo.flush(); }
</script>
<script>
"use strict";
/* ---------- Marca ---------- */
function formMarca(m) {
  const novo = !m; m = m || { nome: "", categoria: "", contato: "", email: "", telefone: "", obs: "", status: "ativo", logo: "" };
  const ini = dateIn(UI.mes, 1);
  const body = `<div class="form">
    <h5>Informações gerais</h5>
    ${fld("Nome da marca", inp("nome", m.nome, 'required maxlength="80" placeholder="Nome da marca"'))}
    ${fld("Categoria", inp("categoria", m.categoria, 'placeholder="Ex.: Moda, Gastronomia"'))}
    <div class="field full"><label>Logo</label><div style="display:flex;align-items:center;gap:12px"><div id="logoPrev">${logoHTML({ ...m, nome: m.nome || "?" }, true)}</div>
      <label class="btn sm" style="cursor:pointer">Escolher imagem<input type="file" accept="image/*" data-change="logo-file" hidden></label>${m.logo ? `<button type="button" class="linkbtn" data-act="logo-remove">Remover</button>` : ""}<input type="hidden" name="logo" value="${esc(m.logo)}"></div></div>
    ${fld("Pessoa de contato", inp("contato", m.contato))}
    ${fld("E-mail", inp("email", m.email, 'type="email"'))}
    ${fld("Telefone", inp("telefone", m.telefone, 'type="tel"'))}
    ${fld("Status", sel("status", Object.entries(MARCA_ST).map(([k, v]) => [k, v.label]), m.status), { hint: "Marcas pausadas ou encerradas não geram novas demandas." })}
    ${fld("Observações", ta("obs", m.obs), { full: true })}
    ${novo ? `<h5>Contrato</h5>
      ${fld("Data de início", inp("inicio", ini, 'type="date" required'))}
      ${fld("Data de término", inp("fim", lastDay(addMonths(UI.mes, 11)), 'type="date"'), { hint: "Deixe vazio para prazo indeterminado." })}
      ${fld("Valor do contrato (R$)", `<div class="val-per"><input name="valor" inputmode="decimal" placeholder="6.000" required data-calc><div class="selw"><select name="periodo" data-calc aria-label="Periodicidade"><option value="mensal">por mês</option><option value="anual">por ano</option></select></div></div>`)}
      ${fld("Dia de vencimento", inp("vencimentoDia", "10", 'type="number" min="1" max="31" required'))}
      <h5>Equipe do contrato</h5>${equipeBoxHTML()}
      <details class="full part-agencia"><summary>Participação da agência <span>(opcional)</span></summary><div class="form">
        ${fld("Tipo", sel("partTipo", [["fixo", "Valor fixo (R$)"], ["percentual", "Percentual (%)"]], "fixo", "data-calc"))}
        ${fld("Participação", inp("partValor", "", 'inputmode="decimal" placeholder="1500 ou 25" data-calc'))}
        <div class="full calc" id="calcBox">Preencha o valor do contrato para ver o cálculo.</div>
        ${fld("Observações financeiras", ta("obsFin", ""), { full: true })}</div></details>` : ""}
  </div>`;
  openModal({ title: novo ? "Nova marca" : `Editar ${m.nome}`, sub: novo ? "Depois de salvar, cadastre as entregas contratuais." : "", body, cls: "wide",
    foot: `<button type="button" class="btn" data-act="close-modal">Cancelar</button><button type="submit" class="btn primary">${novo ? "Criar marca" : "Salvar alterações"}</button>`,
    onSubmit: d => {
      if (!d.nome.trim()) return false;
      if (novo) {
        if (d.fim && d.fim < d.inicio) { toast("A data de término precisa ser depois do início."); return false; }
        const eq = lerEquipeBox(d, ymOf(d.inicio)); if (eq.erro) { toast(eq.erro); return false; }
        const id = uid("m");
        core().marcas.push({ id, nome: d.nome.trim(), logo: d.logo, categoria: d.categoria.trim(), contato: d.contato, email: d.email, telefone: d.telefone, obs: d.obs, status: d.status, criadoEm: TODAY });
        core().contratos.push({ id: uid("ct"), marcaId: id, inicio: d.inicio, fim: d.fim, obsFin: d.obsFin, equipe: eq.itens,
          historico: [{ desde: ymOf(d.inicio), periodo: d.periodo === "anual" ? "anual" : "mensal", valor: num(d.valor), partTipo: d.partTipo, partValor: num(d.partValor), vencimentoDia: Math.min(31, Math.max(1, num(d.vencimentoDia) || 10)) }] });
        Repo.touch("core"); publicarMarcas(); ensureMonth(UI.mes);
        UI.view = "marcas"; UI.marcaId = id; UI.tab = "entregas";
        render(); toast("Marca criada. Agora cadastre as entregas contratuais.");
      } else {
        const antes = m.status;
        Object.assign(m, { nome: d.nome.trim(), logo: d.logo, categoria: d.categoria.trim(), contato: d.contato, email: d.email, telefone: d.telefone, obs: d.obs, status: d.status });
        Repo.touch("core"); publicarMarcas();
        if (antes !== m.status) resyncFrom(CUR, m.id);
        render(); toast("Marca atualizada.");
      }
    },
    onMount: f => { updateCalc(f); montarEquipeBox(f); } });
}
function updateCalc(f) {
  const box = f.querySelector("#calcBox"); if (!box) return;
  const v = num(f.valor?.value), t = f.partTipo?.value, p = num(f.partValor?.value), per = f.periodo?.value === "anual" ? "anual" : "mensal";
  if (!v) { box.textContent = "Preencha o valor do contrato para ver o cálculo."; return; }
  const tt = { valor: v, periodo: per, partTipo: t, partValor: p }; const vm = valorMensal(tt); const parte = calcParte(tt);
  box.innerHTML = per === "anual"
    ? `Contrato de <b>${fmtBRL(v)}/ano</b>, equivalente a <b>${fmtBRL(vm)}/mês</b>. Minha parte <b>${fmtBRL(parte * 12)}/ano</b> (${fmtBRL(parte)}/mês, ${pct(parte, vm)}%).`
    : `Contrato de <b>${fmtBRL(v)}</b>, minha parte <b>${fmtBRL(parte)}</b> (${pct(parte, v)}%). Restante ${fmtBRL(v - parte)}.`;
}
function excluirMarca(id) {
  const m = getMarca(id);
  const n = todosItens().filter(it => it.marcaId === id).length;
  confirmModal(`Excluir ${m.nome}?`, `Isso remove a marca, o contrato, as entregas contratuais, ${n} demandas registradas e os pagamentos. Para manter o histórico, prefira mudar o status para <b>Encerrado</b>.`, "Excluir definitivamente", () => {
    const c = core();
    c.marcas = c.marcas.filter(x => x.id !== id); c.contratos = c.contratos.filter(x => x.marcaId !== id);
    c.obrigacoes = c.obrigacoes.filter(x => x.marcaId !== id); c.pagamentos = c.pagamentos.filter(x => x.marcaId !== id);
    for (const k in S.months) { const before = S.months[k].items.length; S.months[k].items = S.months[k].items.filter(it => it.marcaId !== id); if (before !== S.months[k].items.length) Repo.touch("mes:" + k); }
    if (UI.F.marca === id) UI.F.marca = "";
    Repo.touch("core"); publicarMarcas(); UI.marcaId = null; UI.view = "marcas"; render(); toast(`${m.nome} excluída.`);
  });
}

/* ---------- Excluir só o contrato (a marca continua) ---------- */
function excluirContrato(marcaId) {
  const m = getMarca(marcaId); const c = getContrato(marcaId); if (!m || !c) return;
  const obrigIds = new Set(S.core.obrigacoes.filter(o => o.marcaId === marcaId).map(o => o.id));
  const geradas = []; const mexidas = [];
  for (const k in S.months) S.months[k].items.forEach(it => { if (it.marcaId === marcaId && it.tipo === "contratual") (intocada(it) ? geradas : mexidas).push(it); });
  const nPag = S.core.pagamentos.filter(p => p.marcaId === marcaId).length; const nEq = (c.equipe || []).length;
  const fech = (c.equipe || []).some(a => S.equipe.fechamentos.some(f => f.userId === a.userId && f.mes >= a.desde));
  const partes = [`o contrato (vigência, valores${c.pdf ? ", PDF assinado" : ""})`, obrigIds.size ? `${obrigIds.size} ${obrigIds.size === 1 ? "entrega contratual" : "entregas contratuais"}` : "", geradas.length ? `${geradas.length} ${geradas.length === 1 ? "demanda ainda não iniciada" : "demandas ainda não iniciadas"}` : "", nEq ? `a equipe do contrato (${nEq} ${nEq === 1 ? "pessoa" : "pessoas"}): o valor deixa de entrar no financeiro ${nEq === 1 ? "dela" : "delas"}` : "", nPag ? `${nPag} ${nPag === 1 ? "recebimento registrado" : "recebimentos registrados"}` : ""].filter(Boolean);
  confirmModal(`Excluir o contrato de ${m.nome}?`, `Serão apagados: ${partes.join("; ")}. A marca continua cadastrada e você pode criar um contrato novo depois.${mexidas.length ? ` ${mexidas.length} ${mexidas.length === 1 ? "demanda já trabalhada fica" : "demandas já trabalhadas ficam"} no histórico.` : ""}${fech ? " Meses já fechados no financeiro mantêm os valores congelados." : ""}`, "Excluir contrato", () => {
    const co = core();
    co.contratos = co.contratos.filter(x => x.marcaId !== marcaId);
    co.obrigacoes = co.obrigacoes.filter(o => o.marcaId !== marcaId);
    co.pagamentos = co.pagamentos.filter(p => p.marcaId !== marcaId);
    const ids = new Set(geradas.map(it => it.id));
    for (const k in S.months) { const antes = S.months[k].items.length; S.months[k].items = S.months[k].items.filter(it => !ids.has(it.id)); if (antes !== S.months[k].items.length) Repo.touch("mes:" + k); }
    Repo.touch("core"); UI.tab = "contrato"; render(); toast(`Contrato de ${m.nome} excluído.`);
  });
}
/* ---------- Contrato ---------- */
function formContrato(marcaId) {
  const m = getMarca(marcaId); const c = getContrato(marcaId); const novo = !c;
  const t = c ? termos(c, UI.mes) : { valor: "", partTipo: "fixo", partValor: "", vencimentoDia: 10 };
  const from = c ? ymOf(c.inicio) : addMonths(CUR, -12);
  const body = `<div class="form">
    ${fld("Data de início", inp("inicio", c?.inicio || dateIn(UI.mes, 1), 'type="date" required'))}
    ${fld("Data de término", inp("fim", c ? c.fim : lastDay(addMonths(UI.mes, 11)), 'type="date"'), { hint: "Vazio = indeterminado" })}
    ${fld("Valor do contrato (R$)", `<div class="val-per"><input name="valor" value="${esc(String(t.valor ?? ""))}" inputmode="decimal" placeholder="6.000" required data-calc><div class="selw"><select name="periodo" data-calc aria-label="Periodicidade"><option value="mensal" ${t.periodo !== "anual" ? "selected" : ""}>por mês</option><option value="anual" ${t.periodo === "anual" ? "selected" : ""}>por ano</option></select></div></div>`)}
    ${fld("Dia de vencimento", inp("vencimentoDia", t.vencimentoDia, 'type="number" min="1" max="31" required'))}
    ${novo ? "" : fld("Valores valem a partir de", sel("desde", mesOpts(from, addMonths(CUR, 24)), UI.mes < from ? from : UI.mes), { full: true, hint: "Meses anteriores mantêm os valores antigos. Datas de vigência valem para o contrato inteiro." })}
    ${novo ? `<h5>Equipe do contrato</h5>${equipeBoxHTML()}` : `<div class="full notice">A equipe do contrato é editada no cartão "Equipe do contrato", na aba Contrato e financeiro.</div>`}
    <details class="full part-agencia" ${!novo && num(t.partValor) ? "open" : ""}><summary>Participação da agência <span>(opcional)</span></summary><div class="form">
      ${fld("Tipo", sel("partTipo", [["fixo", "Valor fixo (R$)"], ["percentual", "Percentual (%)"]], t.partTipo, "data-calc"))}
      ${fld("Participação", inp("partValor", t.partValor, 'inputmode="decimal" data-calc'))}
      <div class="full calc" id="calcBox"></div>
      ${fld("Observações financeiras", ta("obsFin", c?.obsFin || ""), { full: true })}</div></details>
  </div>`;
  openModal({ title: novo ? `Criar contrato de ${m.nome}` : `Editar contrato de ${m.nome}`, body, cls: "wide",
    foot: `<button type="button" class="btn" data-act="close-modal">Cancelar</button><button type="submit" class="btn primary">${novo ? "Criar contrato" : "Salvar contrato"}</button>`,
    onSubmit: d => {
      if (d.fim && d.fim < d.inicio) { toast("A data de término precisa ser depois do início."); return false; }
      const novosTermos = { periodo: d.periodo === "anual" ? "anual" : "mensal", valor: num(d.valor), partTipo: d.partTipo, partValor: num(d.partValor), vencimentoDia: Math.min(31, Math.max(1, num(d.vencimentoDia) || 10)) };
      if (novo) {
        const eq = lerEquipeBox(d, ymOf(d.inicio)); if (eq.erro) { toast(eq.erro); return false; }
        core().contratos.push({ id: uid("ct"), marcaId, inicio: d.inicio, fim: d.fim, obsFin: d.obsFin, equipe: eq.itens, historico: [{ desde: ymOf(d.inicio), ...novosTermos }] });
        UI.tab = "entregas"; toast("Contrato criado. Cadastre as entregas contratuais.");
      } else {
        c.inicio = d.inicio; c.fim = d.fim; c.obsFin = d.obsFin;
        const atual = termos(c, d.desde);
        const mudou = !atual || (atual.periodo || "mensal") !== novosTermos.periodo || ["valor", "partTipo", "partValor", "vencimentoDia"].some(k => String(atual[k]) !== String(novosTermos[k]));
        if (mudou) {
          const ex = c.historico.find(h => h.desde === d.desde);
          if (ex) Object.assign(ex, novosTermos); else c.historico.push({ desde: d.desde, ...novosTermos });
        }
        // a entrada mais antiga acompanha o início do contrato
        const h0 = [...c.historico].sort((a, b) => a.desde < b.desde ? -1 : 1)[0];
        if (h0 && h0.desde > ymOf(c.inicio)) h0.desde = ymOf(c.inicio);
        toast(mudou ? `Contrato salvo. Novos valores valem a partir de ${labelMes(d.desde)}.` : "Contrato salvo.");
      }
      Repo.touch("core"); resyncFrom(CUR, marcaId); ensureMonth(UI.mes); render();
    },
    onMount: f => { updateCalc(f); montarEquipeBox(f); } });
}

/* ---------- Pagamento ---------- */
function formRecebimento(marcaId) {
  const m = getMarca(marcaId); const f = financeiro(marcaId, UI.mes);
  if (!f.valor) { toast("Esta marca não tem contrato vigente neste mês."); return; }
  const p = f.pag;
  const body = `<div class="form">
    <div class="full calc">Contrato ${fmtBRL(f.valor)}, minha parte ${fmtBRL(f.parte)}, vencimento ${fmtDataL(f.venc)}.</div>
    ${fld("Status", sel("status", Object.entries(PAG).map(([k, v]) => [k, v.label]), p.status === "pendente" && f.status === "atrasado" ? "atrasado" : p.status))}
    ${fld("Valor recebido (R$)", inp("valorRecebido", p.valorRecebido || (p.status === "pago" ? f.valor : ""), 'inputmode="decimal" placeholder="Para pago, vazio = valor integral"'))}
    ${fld("Data do pagamento", inp("dataPagamento", p.dataPagamento || TODAY, 'type="date"'))}
    ${fld("Observação", inp("obs", p.obs || ""))}
  </div>`;
  openModal({ title: `Recebimento de ${m.nome}`, sub: labelMes(UI.mes), body,
    foot: `<button type="button" class="btn" data-act="close-modal">Cancelar</button><button type="submit" class="btn primary">Salvar recebimento</button>`,
    onSubmit: d => { salvarRecebimento(marcaId, UI.mes, { status: d.status, valorRecebido: d.status === "pago" ? (num(d.valorRecebido) || f.valor) : num(d.valorRecebido), dataPagamento: d.status === "pendente" ? "" : d.dataPagamento, obs: d.obs }); toast("Recebimento salvo."); } });
}

function formObrigacao(marcaId, o) {

  const from = ymOf(c.inicio); const to = addMonths(c.fim ? ymOf(c.fim) : CUR, c.fim ? 0 : 24);
  const desdeDef = novo ? (UI.mes < from ? from : UI.mes) : (UI.mes < o.desde ? o.desde : UI.mes);

    ${fld("Responsável", sel("responsavelId", respOpts(), o.responsavelId))}
    ${fld("Vale a partir de", sel("desde", mesOpts(from, to), desdeDef), { hint: novo ? "Meses anteriores não são alterados." : "Se for depois do início desta versão, cria uma nova versão e preserva os meses anteriores." })}
    ${fld("Observações", ta("obs", o.obs), { full: true })}
  </div>`;
  openModal({ title: novo ? `Nova entrega contratual de ${m.nome}` : `Editar ${o.nome}`, body, cls: "wide",
    foot: `<button type="button" class="btn" data-act="close-modal">Cancelar</button><button type="submit" class="btn primary">Salvar entrega</button>`,
    onSubmit: d => {
      const dados = { nome: d.nome.trim(), categoriaId: d.categoriaId, quantidade: Math.max(1, Math.round(num(d.quantidade))), periodicidade: d.periodicidade,
        intervaloMeses: Math.max(1, Math.round(num(d.intervaloMeses) || 1)), mesUnico: d.periodicidade === "unica" ? d.mesUnico : "", responsavelId: d.responsavelId, obs: d.obs };
      if (!dados.nome) return false;
      let desde = d.desde;

      if (novo) {
        core().obrigacoes.push({ id: uid("o"), linhagem: uid("l"), marcaId, ...dados, desde, ate: null });
      } else if (desde <= o.desde) {
        Object.assign(o, dados); desde = o.desde;
      } else {
        const nova = { ...clone(o), id: uid("o"), ...dados, desde, ate: o.ate };

    } });

<script>

/* ---------- Demandas ---------- */

/** admin: aplica as exclusões que os colaboradores fizeram (some do financeiro e das demandas) */
async function aplicarExclusoes() {
  if (!S.exclusoes?.length || (SESSION.mode === "conta" && realUser()?.papel !== "admin")) return;
  const feitos = [];
  for (const x of S.exclusoes) {
    const f = findTrab(x.trabId || x.id);
    if (!f) { feitos.push({ x, real: false }); continue; }
    if (f.envio || f.t.userId !== x.userId || f.t.origem !== "colaborador" || f.t.status === "pago" || getFech(f.t.userId, f.mes)) continue; // fica para o admin decidir
    S.trab[f.mes].itens = S.trab[f.mes].itens.filter(t => t.id !== f.t.id); Repo.touch("trab:" + f.mes);
    todosItens().filter(it => it.trabalhoId === f.t.id).forEach(it => { it.trabalhoId = ""; Repo.touch("mes:" + it.mes); });
    feitos.push({ x, real: true });
  }
  if (!feitos.length) return;
  try { await flushNow(); } catch (_) { return; }
  for (const { x } of feitos) { try { await Repo.be.del(`envios/${x.cid}/excluir/${x.id}`); } catch (_) { } }
  S.exclusoes = S.exclusoes.filter(x => !feitos.some(f => f.x === x));
  const reais = feitos.filter(f => f.real).map(f => f.x);
  if (reais.length) setTimeout(() => toast(`${[...new Set(reais.map(x => nomeResp(x.userId).split(" ")[0]))].join(", ")} excluiu ${reais.length} ${reais.length === 1 ? "trabalho registrado" : "trabalhos registrados"} por engano: ${reais.map(x => x.descricao).join("; ")}.`), 900);
}

function busca(q) {
  const toks = norm(q).split(/\s+/).filter(Boolean); const out = { marcas: [], users: [], itens: [], trabs: [] };
  if (!toks.length) return out;
  const match = hay => toks.every(t => hay.includes(t));
  if (isAdmin()) {
    out.marcas = S.core.marcas.filter(m => match(norm(`${m.nome} ${m.categoria} ${m.contato}`)));
    out.users = S.dir.usuarios.filter(u => match(norm(`${u.nome} ${u.funcao} ${PAPEL[u.papel].label}`)));
  }
  for (const it of meusItens(todosItens())) if (match(norm(`${it.titulo} ${nomeMarca(it.marcaId)} ${nomeCat(it.categoriaId)} ${nomeResp(it.responsavelId)} ${it.obs} ${it.local || ""} ${it.tipo} ${STATUS[stEf(it)].label}`))) out.itens.push(it);
  const ts = isAdmin() ? trabalhosTodos() : trabalhosDe(me().id);
  for (const t of ts) if (match(norm(`${t.projeto} ${nomeTipo(t.tipoId)} ${nomeMarca(t.marcaId)} ${nomeResp(t.userId)} ${TRAB_ST[t.status].label}`))) out.trabs.push(t);
  out.itens.sort((a, b) => Math.abs(diffDays(TODAY, a.data)) - Math.abs(diffDays(TODAY, b.data)));
  out.trabs.sort((a, b) => a.data < b.data ? 1 : -1);
  return out;
}

    <p class="muted">${admin ? "Sua conta do Claude será vinculada a este perfil de administrador." : "Sua conta do Claude fica ligada a este nome. Em seguida você cria sua senha e já entra."} Confira antes de continuar.</p>
    <div class="gate-acts"><button class="btn" data-act="gate-voltar">${IC.left}Voltar</button><button class="btn primary" data-act="${acao}" data-id="${u.id}">Sim, sou ${esc(u.nome.split(" ")[0])}</button></div>`);
}
/** conta que só pode ler (Leitor, Comentarista ou fora da organização): não consegue nem enviar o pedido */
function telaSemPermissao() {
  const email = SESSION.emailConta ? `<b>${esc(SESSION.emailConta)}</b>` : "o e-mail da sua conta Claude";
  gate(`<h2>Falta liberar sua conta</h2>
    <p class="muted">Você entrou${SESSION.nomeConta ? ` como <b>${esc(SESSION.nomeConta)}</b>` : ""}, mas sua conta está com acesso <b>só de leitura</b> a este app, então o pedido de acesso não consegue ser enviado.</p>
    <div class="notice" style="margin:12px 0"><span>Envie para Isabella ou Duda: “Preciso de acesso de <b>Colaborador</b> na Central de Operação com ${email}”.</span></div>
    <p class="muted small">Isso acontece quando a conta foi adicionada como Leitor, ou quando é uma conta de fora da organização da Boltz no Claude. Depois que liberarem, recarregue esta página.</p>
    <button class="btn primary" data-act="gate-recarregar">Recarregar</button>`);
}
async function telaVinculo() {
  if (SESSION.podeEscrever === false && !SESSION.canEdit && !SESSION.owner) { telaSemPermissao(); return; }
  const editor = SESSION.canEdit || SESSION.owner;
  // perfis livres que esta conta pode usar (com e-mail cadastrado, só a conta desse e-mail)
  const livres = S.dir.usuarios.filter(u => u.ativo && !u.claudeId && (u.papel === "admin" ? editor : (!u.email || mesmoEmail(u.email, SESSION.emailConta))));
  const meuPorEmail = SESSION.emailConta ? livres.find(u => mesmoEmail(u.email, SESSION.emailConta)) : null;
  const sugestao = SESSION.nomeDigitado || meuPorEmail?.nome || "";
  const aviso = SESSION.avisoVinculo ? `<div class="notice" style="margin:12px 0">${esc(SESSION.avisoVinculo)}</div>` : "";
  gate(`<h2>Primeiro acesso</h2><p class="muted">Digite seu nome e crie uma senha. Nas próximas vezes, é só tocar no seu nome e digitar a senha.</p>${aviso}
    <form id="gateForm" class="gate-form" autocomplete="on">
      <div class="field"><label for="gNome">Seu nome</label><input id="gNome" name="nome" autocomplete="username" required maxlength="60" value="${esc(sugestao)}" placeholder="Ex.: Letícia Vallim"></div>
      ${livres.length ? `<div class="gate-sug"><span class="muted small">Já cadastrados:</span>${livres.map(u => `<button type="button" class="gate-chip" data-act="gate-nome" data-nome="${esc(u.nome)}">${esc(u.nome)}</button>`).join("")}</div>` : ""}
      <div class="field"><label for="gN1">Crie uma senha</label><input id="gN1" type="password" name="s1" autocomplete="new-password" minlength="6" required><span class="hint">Mínimo de 6 caracteres.</span></div>
      <div class="field"><label for="gN2">Confirme a senha</label><input id="gN2" type="password" name="s2" autocomplete="new-password" required></div>
      <p class="gate-err" id="gateErr" role="alert"></p><button class="btn primary" type="submit">Salvar e entrar</button></form>`);
  gateForm(d => primeiroAcesso(d));
  setTimeout(() => (sugestao ? $("#gN1") : $("#gNome"))?.focus(), 40);
}
/** acha o perfil pelo nome digitado: igual (sem acento), ou o primeiro nome quando o cadastro tem um nome só (ex.: "Letícia Vallim" → "Letícia") */
function acharPerfil(nome) {
  const n = norm(nome).trim(); const pri = n.split(" ")[0];
  return S.dir.usuarios.find(u => norm(u.nome).trim() === n)
    || S.dir.usuarios.find(u => !u.claudeId && u.ativo && !norm(u.nome).trim().includes(" ") && norm(u.nome).trim() === pri);
}
async function primeiroAcesso(d) {
  const nome = String(d.nome || "").trim().replace(/\s+/g, " ");
  if (nome.length < 2) return "Digite seu nome.";
  const e = validaNova(d.s1 || ""); if (e) return e;
  if (d.s1 !== d.s2) return "As senhas não conferem.";
  SESSION.nomeDigitado = nome; SESSION.avisoVinculo = "";
  const editor = SESSION.canEdit || SESSION.owner;
  const pedido = (u, extra = {}) => Repo.be.set("acesso/" + SESSION.cid, { userId: u.id, nomeConta: SESSION.nomeConta || "", email: SESSION.emailConta || "", em: TODAY, auto: true, ...extra });
  let u = acharPerfil(nome);
  if (u) {
    if (u.claudeId && u.claudeId !== SESSION.cid) return `${u.nome} já entrou com outra conta. Se é você, peça para Isabella ou Duda desvincularem a conta antiga em Acessos.`;
    if (!u.ativo) return `${u.nome} está desativado. Fale com um administrador.`;
    if (u.papel === "admin" && !editor) return `${u.nome} é um perfil de administrador e precisa de permissão de Editor no compartilhamento. Peça para a Isabella e recarregue.`;
    if (u.papel !== "admin" && u.email && !mesmoEmail(u.email, SESSION.emailConta)) return `O nome ${u.nome} está reservado para outro e-mail. Entre no Claude com o e-mail cadastrado ou fale com a Isabella.`;
    if (editor) { u.claudeId = SESSION.cid; try { await Repo.be.set("pub/dir", S.dir); } catch (_) { u.claudeId = ""; return "Não foi possível salvar. Verifique sua conexão."; } }
    else { try { await pedido(u); } catch (_) { telaSemPermissao(); return; } SESSION.provisorio = u.id; u.claudeId = SESSION.cid; }
  } else {
    u = { id: uid("u"), nome, papel: "colaborador", ativo: true, funcao: "", email: SESSION.emailConta || "", telefone: "", obs: "", desativadoEm: "", claudeId: SESSION.cid, criadoEm: TODAY, autoCadastro: true };
    if (editor) { S.dir.usuarios.push(u); try { await Repo.be.set("pub/dir", S.dir); } catch (_) { S.dir.usuarios = S.dir.usuarios.filter(x => x !== u); return "Não foi possível salvar. Verifique sua conexão."; } }
    else { try { await pedido(u, { novo: true, nome }); } catch (_) { telaSemPermissao(); return; } S.dir.usuarios.push(u); SESSION.provisorio = u.id; SESSION.novoPerfil = { ...u }; }
  }
  let cred; try { cred = await gravarSenha(u, d.s1, false); } catch (_) { return "Não foi possível salvar a senha. Verifique seu acesso ao app."; }
  marcarDesbloqueado(credKey(u), cred); ULTIMA_ATIV = Date.now(); SESSION.nomeDigitado = "";
  SESSION.userId = u.id; await carregarDados(); entrar();
  toast("Cadastro feito. Nas próximas vezes, toque no seu nome e digite a senha.");
}
/** volta de quem já tem cadastro: toca no nome e digita a senha */
async function telaEntrar(u) {
  const k = credKey(u); let cred = null; try { cred = await Repo.be.get("cred/" + k); } catch (_) { }
  const seguir = async () => { SESSION.userId = u.id; await carregarDados(); entrar(); };
  if (!cred || (!cred.temporaria && estaDesbloqueado(k, cred))) return exigirSenha(u, seguir);
  SESSION.aoEntrar = () => telaSenha(u, cred, seguir);
  gate(`<h2>Entrar</h2><p class="muted">Toque no seu nome e digite sua senha.</p>
    <div class="gate-users"><button class="gate-user" data-act="gate-entrar-nome">${avatar(u)}<span><b>${esc(u.nome)}</b><small>${PAPEL[u.papel].label}</small></span></button></div>${naoSouEu()}`);
}

/* ---------- Inicialização ---------- */
function semConta() {
  gate(`<h2>Entre com sua conta Claude</h2><p class="muted">Os perfis e dados da Boltz ficam guardados na conta da empresa. Não foi possível identificar a sua conta neste acesso.</p>
    <p class="muted">Abra o link no claude.ai já logado com o e-mail que recebeu o convite. Se você já está logado e continua vendo esta tela, peça para Isabella ou Duda compartilharem o app com o seu e-mail.</p>
    <button class="btn" data-act="gate-recarregar">Recarregar</button>`);
}
async function conectarConta() {
  for (let i = 0; i < 60 && !(window.claude && window.claude.use); i++) await sleep(100);
  if (!(window.claude && window.claude.use)) return false; // fora do claude.ai: modo de demonstração local
  const db = await window.claude.use("db").catch(() => null); if (!db) { semConta(); return true; }
  const user = await window.claude.use("user").catch(() => null); const cid = user ? await user.id().catch(() => null) : null; if (!cid) { semConta(); return true; }
  SESSION.mode = "conta"; SESSION.cid = cid; SESSION.owner = await user.isOwner(); SESSION.canEdit = await user.canEdit();
  try { const eu = await user.me(); SESSION.nomeConta = eu?.name || ""; SESSION.emailConta = eu?.email || ""; } catch (_) { }
  try { SESSION.podeEscrever = await user.can("data.write"); } catch (_) { SESSION.podeEscrever = null; }
  Repo.be = ClaudeBackend(db);
  DOWNLOADS = await window.claude.use("downloads").catch(() => null);
  ASSETS = await window.claude.use("assets").catch(() => null);
  SAMPLE = await window.claude.use("sample").catch(() => null);
  SAMPLE_IMG = SAMPLE ? ((await SAMPLE.limits().catch(() => null))?.images || null) : null;
  let dir;
  try { dir = await Repo.be.get("pub/dir"); } catch (_) { dir = null; }
  if (!dir) {
    if (SESSION.canEdit || SESSION.owner) {
      S = estadoInicial();
      await Repo.be.set("pub/dir", S.dir); await Repo.be.set("adm/core", S.core); await Repo.be.set("adm/equipe", S.equipe);
      try { for (const d of await Repo.be.list(`data/users/${cid}`)) await Repo.be.del(`data/users/${cid}/${d.id}`); } catch (_) { } // remove dados da versão anterior
    } else { gate(`<h2>Sem acesso ainda</h2><p class="muted">Ou o sistema ainda não foi configurado por um administrador, ou sua conta tem acesso somente leitura. Peça para Isabella ou Duda compartilharem o app com você como <b>Colaborador</b> e recarregue.</p><button class="btn" data-act="gate-recarregar">Recarregar</button>`); return true; }
  } else S.dir = dir;
  const u = S.dir.usuarios.find(x => x.claudeId === cid) || await vinculoProvisorio();
  if (!u) { await telaVinculo(); return true; }
  if (!u.ativo) { gate(`<h2>Acesso desativado</h2><p class="muted">Seu usuário está desativado. Fale com um administrador.</p>`); return true; }
  if (u.papel === "admin" && !SESSION.canEdit && !SESSION.owner) { gate(`<h2>Falta permissão de Editor</h2><p class="muted">Seu perfil aqui é admin, mas o app foi compartilhado com você sem permissão de edição. Peça para ser <b>Editor</b> no compartilhamento e recarregue.</p><button class="btn" data-act="gate-recarregar">Recarregar</button>`); return true; }
  await telaEntrar(u);
  document.addEventListener("visibilitychange", async () => { if (document.visibilityState === "visible" && SESSION.userId && !$("#mform") && !Repo.dirty.size && !Repo.busy) { await carregarDados(); render(); } });
  return true;
}
// bloqueio automático após 30 minutos sem uso
["pointerdown", "keydown", "scroll"].forEach(ev => document.addEventListener(ev, () => { ULTIMA_ATIV = Date.now(); }, { passive: true }));
setInterval(() => { if (SESSION.userId && Date.now() - ULTIMA_ATIV > 30 * 60000) bloquear("Sessão bloqueada após 30 minutos sem uso."); }, 30000);
(async function boot() {
  try { const t = localStorage.getItem("gm2:tema") || localStorage.getItem("gestao-marcas:v1:tema"); if (t) document.documentElement.dataset.theme = t; localStorage.removeItem("gestao-marcas:v1"); localStorage.removeItem("gestao-marcas:v1:tema"); } catch (_) { }
  gate(`<p class="muted">Carregando…</p>`);
  let ok = false;
  try { ok = await conectarConta(); } catch (e) { console.warn("Conta indisponível", e); ok = false; }
  if (ok) return;
  await carregarLocal();
  let last = null; try { last = sessionStorage.getItem("gm2:user"); } catch (_) { }
  if (last && getUser(last)?.ativo) await entrarLocal(last); else telaLogin();
  setInterval(() => { const t = isoOf(new Date()); if (t !== TODAY && SESSION.userId && !$("#mform")) render(); else if (SESSION.userId && UI.view === "homeoffice" && !$("#mform")) render(); }, 60000);
})();
</script>

function initFirebase() {
  try {
    const app = firebase.initializeApp(fbConfig);
    const db = firebase.firestore(app);
    if (typeof Repo !== "undefined") Repo.be = FirestoreBackend(db);
    console.log("✅ Firebase OK!");
  } catch (e) {
    console.error("Firebase error:", e.message);
  }
}

function FirestoreBackend(db) {
  return {
    async get(p) {
      const [c, ...d] = p.split('/');
      try { return (await db.collection(c).doc(d.join('/')).get()).data() || null; } catch (e) { return null; }
    },
    async set(p, d) {
      const [c, ...dp] = p.split('/');
      try { await db.collection(c).doc(dp.join('/')).set(d, { merge: true }); } catch (e) { }
    },
    async del(p) {
      const [c, ...d] = p.split('/');
      try { await db.collection(c).doc(d.join('/')).delete(); } catch (e) { }
    },
    async list(c) {
      try { return (await db.collection(c).get()).docs.map(d => ({ id: d.id, ...d.data() })); } catch (e) { return []; }
    }
  };
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initFirebase);
} else {
  initFirebase();
}
</script>
