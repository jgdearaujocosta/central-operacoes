<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Central de Operação | Boltz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F0E8; --surface:#FBF8F3; --surface-2:#F1ECE3; --ink:#141414; --ink-2:#38352F; --muted:#6B655C; --faint:#9C958A;
  --line:#E2DBCF; --line-2:#ECE6DC;
  --accent:#7B3FE4; --accent-ink:#FFFFFF; --accent-soft:#EEE6FC;
  --green:#1E7F48; --green-soft:#E4F1E6; --yellow:#9A660A; --yellow-soft:#F8EDD5; --red:#BE2F2F; --red-soft:#F8E4E1;
  --orange:#B8530F; --orange-soft:#F9E8D9; --gray-soft:#ECE6DC;
  --radius:4px; --radius-sm:3px; --shadow:none;
  --font:"Nunito Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display:"Poppins", "Nunito Sans", system-ui, sans-serif;
  --mono:"Space Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141312; --surface:#1C1A18; --surface-2:#23211E; --ink:#F2EDE4; --ink-2:#D6D0C5; --muted:#A39C90; --faint:#746E64;
    --line:#2F2C28; --line-2:#272421; --accent:#A783F5; --accent-ink:#160B2E; --accent-soft:#2A2140;
    --green:#5CC28A; --green-soft:#183326; --yellow:#E2B356; --yellow-soft:#3A2E14; --red:#F07B7B; --red-soft:#3D1D1D;
    --orange:#F09A5B; --orange-soft:#3B2617; --gray-soft:#2A2724; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141312; --surface:#1C1A18; --surface-2:#23211E; --ink:#F2EDE4; --ink-2:#D6D0C5; --muted:#A39C90; --faint:#746E64;
    --line:#2F2C28; --line-2:#272421; --accent:#A783F5; --accent-ink:#160B2E; --accent-soft:#2A2140;
    --green:#5CC28A; --green-soft:#183326; --yellow:#E2B356; --yellow-soft:#3A2E14; --red:#F07B7B; --red-soft:#3D1D1D;
    --orange:#F09A5B; --orange-soft:#3B2617; --gray-soft:#2A2724; --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
img{max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;padding:20px 14px}
.brandmark{display:flex;align-items:center;gap:10px;padding:2px 8px 22px}
.brandmark .bz{display:flex;align-items:center;gap:1px;color:var(--ink)}
.brandmark .bz svg{width:16px;height:24px;flex:none}
.brandmark .bz span{font-family:var(--display);font-weight:700;font-size:25px;letter-spacing:-.045em;line-height:1}
.brandmark small{display:block;color:var(--muted);font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;margin-top:8px}
.brandmark{flex-direction:column;align-items:flex-start;gap:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:4px;text-align:left;color:var(--ink-2);font-weight:500}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;font-size:11px;background:var(--red-soft);color:var(--red);border-radius:20px;padding:1px 7px;font-weight:600}
.side-foot{margin-top:auto;padding:10px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block;flex:none}
.dot.ok{background:var(--green)} .dot.saving{background:var(--yellow)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 28px}
.top-row{display:flex;align-items:center;gap:12px}
.search{position:relative;flex:1;max-width:520px}
.search input{width:100%;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:0 12px 0 36px}
.search svg{position:absolute;left:11px;top:11px;width:16px;height:16px;color:var(--faint)}
.search kbd{position:absolute;right:9px;top:9px;font-family:var(--font);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--faint);background:var(--surface-2)}
.results{position:absolute;top:44px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:0 12px 32px rgba(0,0,0,.12);max-height:min(70vh,520px);overflow:auto;padding:6px;display:none}
.results.open{display:block}
.results h6{margin:8px 8px 4px;font-size:12px;color:var(--muted);font-weight:500}
.results button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;padding:8px;border-radius:4px;text-align:left}
.results button:hover,.results button.hl{background:var(--surface-2)}
.results .r-main{flex:1;min-width:0}
.results .r-main b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.results .r-main span{font-size:12px;color:var(--muted)}
.results .empty{padding:14px;color:var(--muted)}
.top-actions{display:flex;gap:8px;margin-left:auto}

/* month strip */
.months{display:flex;align-items:stretch;gap:6px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.months::-webkit-scrollbar{display:none}
.mbtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:7px 12px 8px;min-width:96px;text-align:left;display:flex;flex-direction:column;gap:5px}
.mbtn .ml{font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.mbtn .mbar{height:3px;border-radius:2px;background:var(--line-2);overflow:hidden;position:relative}
.mbtn .mbar i{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:2px}
.mbtn .mbar.none{background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 7px)}
.mbtn .mp{font-size:11px;color:var(--faint)}
.mbtn.cur .ml::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
.mbtn[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mnav{flex:none;width:34px;border:1px solid var(--line);background:var(--surface);border-radius:4px;display:grid;place-items:center}
.mnav svg{width:16px;height:16px}

.content{padding:24px 28px 80px;max-width:1440px;width:100%}

/* ---------- Primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:4px;border:1px solid var(--line);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,var(--line))}
.btn.danger:hover{background:var(--red-soft)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn svg{width:16px;height:16px}
.icon-btn{width:32px;height:32px;padding:0;border-radius:4px;border:1px solid transparent;background:none;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:16px;height:16px}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{margin:0;font-size:26px;letter-spacing:-.025em;font-weight:600;line-height:1.15}
.page-head p{margin:4px 0 0;color:var(--muted)}
.back{border:0;background:none;color:var(--muted);padding:0;margin-bottom:10px;display:inline-flex;align-items:center;gap:4px;font-size:13px}
.back:hover{color:var(--ink)}
.back svg{width:14px;height:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.card-h h2,.card-h h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.card-h .sub{color:var(--muted);font-size:12.5px;font-weight:400;margin-left:6px}
.card-b{padding:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:16px}

/* KPI band: one card, divided cells */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.kpi{padding:16px 18px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);min-width:0}
.kpi:nth-child(4n){border-right:0}
.kpi:nth-last-child(-n+4){border-bottom:0}
.kpi .k-l{font-size:12.5px;color:var(--muted)}
.kpi .k-v{font-size:26px;font-weight:600;letter-spacing:-.03em;margin-top:4px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-s{font-size:12px;color:var(--faint);margin-top:4px}
.kpi .k-v.red{color:var(--red)} .kpi .k-v.green{color:var(--green)}
.kpi .pbar{margin-top:8px}
button.kpi{border:0;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);background:none;text-align:left}
button.kpi:hover{background:var(--surface-2)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.sel{position:relative}
.sel select,.field select{appearance:none;-webkit-appearance:none;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:0 30px 0 11px;font-size:13px;max-width:220px}
.sel::after,.field .selw::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel select.on{border-color:var(--ink);background:var(--surface-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:0 12px;height:32px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.linkbtn{border:0;background:none;color:var(--accent);padding:4px 6px;font-size:13px;font-weight:500}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:20px;font-size:12px;font-weight:500;background:var(--gray-soft);color:var(--ink-2);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.badge.nodot::before{display:none}
.b-green{background:var(--green-soft);color:var(--green)}
.b-yellow{background:var(--yellow-soft);color:var(--yellow)}
.b-red{background:var(--red-soft);color:var(--red)}
.b-orange{background:var(--orange-soft);color:var(--orange)}
.b-blue{background:var(--accent-soft);color:var(--accent)}
.b-gray{background:var(--gray-soft);color:var(--muted)}
.b-dark{background:var(--ink);color:var(--surface)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font-size:11.5px;font-weight:500;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.avulsa{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));color:var(--accent);background:var(--accent-soft)}

/* status select pill */
.stsel{position:relative;display:inline-block}
.stsel select{appearance:none;-webkit-appearance:none;border:0;height:26px;border-radius:20px;padding:0 24px 0 22px;font-size:12px;font-weight:500;cursor:pointer}
.stsel::before{content:"";position:absolute;left:10px;top:10px;width:6px;height:6px;border-radius:50%;background:currentColor;pointer-events:none}
.stsel::after{content:"";position:absolute;right:10px;top:9px;width:5px;height:5px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);pointer-events:none;opacity:.7}
.st-a_fazer{background:var(--gray-soft);color:var(--ink-2)}
.st-andamento{background:var(--yellow-soft);color:var(--yellow)}
.st-concluido{background:var(--green-soft);color:var(--green)}
.st-atrasado{background:var(--red-soft);color:var(--red)}
.st-cancelado{background:var(--gray-soft);color:var(--faint)}
.stsel.st-a_fazer,.stsel.st-andamento,.stsel.st-concluido,.stsel.st-atrasado,.stsel.st-cancelado{background:none}
.stsel select.st-a_fazer{background:var(--gray-soft);color:var(--ink-2)}

/* progress */
.pbar{height:6px;border-radius:4px;background:var(--line-2);overflow:hidden;min-width:60px}
.pbar i{display:block;height:100%;background:var(--ink);border-radius:4px}
.pbar.green i{background:var(--green)} .pbar.yellow i{background:var(--yellow)} .pbar.red i{background:var(--red)}
.prog{display:flex;align-items:center;gap:10px}
.prog .pbar{flex:1}
.prog b{font-weight:600;font-size:13px;min-width:38px;text-align:right}

/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{font-weight:500;color:var(--muted);font-size:12.5px;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.t td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
.t tr:last-child td{border-bottom:0}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover td{background:var(--surface-2)}
.t .num{text-align:right}
.t tfoot td{font-weight:600;border-top:1px solid var(--line);background:var(--surface-2)}
.mname{display:flex;align-items:center;gap:10px}
.mname b{font-weight:600}
.mname small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.logo{width:32px;height:32px;border-radius:4px;flex:none;display:grid;place-items:center;font-weight:600;font-size:12px;overflow:hidden;background:var(--gray-soft);color:var(--ink-2);border:1px solid var(--line-2)}
.logo img{width:100%;height:100%;object-fit:cover}
.logo.lg{width:56px;height:56px;border-radius:12px;font-size:19px}

/* checklist */
.group{border-top:1px solid var(--line-2)}
.group:first-child{border-top:0}
.group-h{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface-2)}
.group-h h4{margin:0;font-size:13.5px;font-weight:600}
.group-h .gcount{margin-left:auto;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:10px}
.group-h .gcount .pbar{width:80px}
.row{display:flex;align-items:center;gap:12px;padding:9px 16px;border-top:1px solid var(--line-2)}
.row:hover{background:var(--surface-2)}
.chk{appearance:none;-webkit-appearance:none;width:19px;height:19px;border:1.5px solid var(--faint);border-radius:5px;flex:none;display:grid;place-items:center;margin:0;cursor:pointer;background:var(--surface)}
.chk:checked{background:var(--green);border-color:var(--green)}
.chk:checked::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.chk:disabled{opacity:.4;cursor:not-allowed}
.row .r-t{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0}
.row .r-t b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r-t span{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:1px}
.row.done .r-t b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.row.cancel .r-t b{color:var(--faint);text-decoration:line-through}
.row .r-d{font-size:12.5px;color:var(--muted);width:54px;text-align:right;flex:none}
.row .r-d.late{color:var(--red);font-weight:500}
.row .r-r{font-size:12.5px;color:var(--muted);width:90px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.empty-state{padding:36px 20px;text-align:center;color:var(--muted)}
.empty-state b{display:block;color:var(--ink);font-weight:600;font-size:15px;margin-bottom:4px}
.empty-state .btn{margin-top:14px}

/* alerts */
.alerts{display:flex;flex-direction:column}
.alert{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;border-top:1px solid var(--line-2);border-left:0;border-right:0;border-bottom:0;background:none;text-align:left;width:100%}
.alert:first-child{border-top:0}
.alert:hover{background:var(--surface-2)}
.alert .ai{width:26px;height:26px;border-radius:4px;display:grid;place-items:center;flex:none;font-size:13px}
.alert .ai svg{width:14px;height:14px}
.alert b{font-weight:600;display:block}
.alert span{color:var(--muted);font-size:12.5px}
.alert .am{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap;padding-top:2px}

/* today */
.today-item{display:flex;align-items:center;gap:10px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line)}
.cal .dow{padding:8px 10px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface-2)}
.cal .day{min-height:118px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.cal .day:nth-child(7n){border-right:0}
.cal .day.out{background:var(--surface-2)}
.cal .day.out .dn{color:var(--faint)}
.cal .day:hover{background:var(--surface-2)}
.cal .dn{font-size:12.5px;font-weight:500;color:var(--ink-2);padding:2px 4px;align-self:flex-start;border-radius:6px}
.cal .day.today .dn{background:var(--accent);color:var(--accent-ink)}
.chip{display:flex;align-items:center;gap:6px;border:0;background:var(--surface-2);border-radius:5px;padding:3px 6px;font-size:11.5px;text-align:left;width:100%;min-width:0;border-left:3px solid var(--faint)}
.cal .day:hover .chip{background:var(--surface)}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.c-concluido{border-left-color:var(--green);color:var(--muted)}
.chip.c-andamento{border-left-color:var(--yellow)}
.chip.c-atrasado{border-left-color:var(--red)}
.chip.c-cancelado{border-left-color:var(--line);color:var(--faint);text-decoration:line-through}
.chip.c-a_fazer{border-left-color:var(--faint)}
.chip.av{background:var(--accent-soft)}
.more{font-size:11.5px;color:var(--muted);padding:1px 6px}
.cal-dots{display:none}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,15,15,.38);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border-radius:14px;width:min(640px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.25);animation:pop .16s ease-out}
.modal.wide{width:min(860px,100%)}
.modal.drawer{width:min(520px,100%)}
@keyframes pop{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:flex-start;gap:10px;padding:18px 20px 14px;border-bottom:1px solid var(--line-2)}
.modal-h h3{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.modal-h p{margin:3px 0 0;color:var(--muted);font-size:13px}
.modal-h .icon-btn{margin-left:auto}
.modal-b{padding:18px 20px;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.modal-f .left{margin-right:auto}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}
.form h5{grid-column:1/-1;margin:6px 0 -4px;font-size:13px;font-weight:600;color:var(--ink-2);padding-top:10px;border-top:1px solid var(--line-2)}
.form h5:first-child{border-top:0;padding-top:0;margin-top:0}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.field input,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:8px 11px;min-height:36px;width:100%}
.field textarea{min-height:72px;resize:vertical}
.field .selw{position:relative}
.field select{max-width:none;width:100%;height:36px;font-size:14px}
.field .hint{font-size:12px;color:var(--faint)}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.calc{background:var(--surface-2);border:1px dashed var(--line);border-radius:4px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.status-pick{display:flex;flex-wrap:wrap;gap:6px}
.status-pick button{border:1px solid var(--line);background:var(--surface);border-radius:20px;height:30px;padding:0 12px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.status-pick button::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sc)}
.status-pick button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:500}
.dl{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:13.5px}
.dl dt{color:var(--muted)} .dl dd{margin:0}

/* toast */
.toasts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:4px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:pop .18s ease-out;display:flex;gap:12px;align-items:center}
.toast button{border:0;background:none;color:inherit;text-decoration:underline;padding:0}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.brand-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.brand-head h1{margin:0;font-size:26px;letter-spacing:-.025em;font-weight:600}
.brand-head .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:4px}
.brand-head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.counts{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px}
.counts span{display:inline-flex;align-items:center;gap:7px}
.counts i{width:8px;height:8px;border-radius:50%;display:inline-block}

.oblist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ob{border:1px solid var(--line-2);border-radius:4px;padding:12px;background:var(--surface-2)}
.ob .ob-n{font-size:12.5px;color:var(--muted)}
.ob .ob-v{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:2px 0 8px}
.ob .ob-v small{font-size:13px;color:var(--faint);font-weight:500}

.brand-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.bcard{text-align:left;padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow)}
.bcard:hover{border-color:var(--faint)}
.bcard .row2{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.bcard .row2 b{color:var(--ink);font-weight:600}

/* report */

.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.notice{background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:12px 14px;font-size:13px;color:var(--ink-2);display:flex;gap:10px;align-items:flex-start}
.muted{color:var(--muted)} .small{font-size:12.5px}
.hide-d{display:none}
.mobile-nav{display:none}
.mob-only{display:none}
.mob-only .logo{width:30px;height:30px}

/* ---------- Responsive ---------- */
@media (max-width: 1180px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(4n){border-right:1px solid var(--line-2)}
  .kpi:nth-child(2n){border-right:0}
  .kpi:nth-last-child(-n+4){border-bottom:1px solid var(--line-2)}
  .kpi:nth-last-child(-n+2){border-bottom:0}
  .g-main{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .top{padding:10px 14px}
  .content{padding:18px 14px 110px}
  .top-actions .btn span{display:none}
  .mob-only{display:inline-grid}
  .top-actions .btn{padding:0 10px}
  .search kbd{display:none}
  .mobile-nav{display:grid;position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .mobile-nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;font-size:10.5px;color:var(--muted)}
  .mobile-nav button svg{width:20px;height:20px}
  .mobile-nav button[aria-current="page"]{color:var(--accent)}
  .g2{grid-template-columns:minmax(0,1fr)}
  .form{grid-template-columns:minmax(0,1fr)}
  .kpi .k-v{font-size:21px}
  .page-head h1,.brand-head h1{font-size:22px}
  .row .r-r{display:none}
  .row{padding:10px 12px;gap:6px 10px;flex-wrap:wrap}
  .row .r-t{flex:1 1 calc(100% - 32px)}
  .row .r-d{margin-left:29px;text-align:left;width:auto}
  .row .stsel{margin-left:auto}
  .filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-14px;margin-right:-14px;padding:0 14px}
  .filters::-webkit-scrollbar{display:none}
  .filters>*{flex:none}
  .cal .day{min-height:64px;padding:4px}
  .cal .chip,.cal .more{display:none}
  .cal-dots{display:flex;gap:3px;flex-wrap:wrap;padding:0 4px}
  .cal-dots i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
  .overlay{align-items:flex-end;padding:0}
  .modal,.modal.wide,.modal.drawer{width:100%;border-radius:4px 16px 0 0;max-height:92vh;padding-bottom:env(safe-area-inset-bottom,0px)}
        .dl{grid-template-columns:1fr}
  .dl dt{margin-top:6px}
}

/* ---------- v2: equipe e pagamentos ---------- */
.logo.av{border-radius:50%;background:var(--surface-2)}
.logo.av.lg{border-radius:50%}
.kpi .k-v small{font-size:15px;color:var(--faint);font-weight:500}
.kpi .k-v.yellow{color:var(--yellow)}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis.k3 .kpi{border-bottom:0}.kpis.k3 .kpi:nth-child(3n){border-right:0}
.kpis.k1{grid-template-columns:minmax(0,1fr);margin:0;height:100%}
.kpis.k1 .kpi{border-right:0;border-bottom:1px solid var(--line-2)}.kpis.k1 .kpi:last-child{border-bottom:0}
.bk{display:flex;flex-direction:column}
.bk-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.bk-row span{color:var(--ink-2)} .bk-row small{display:block;color:var(--faint);font-size:12px}
.bk-row b{font-weight:600;font-size:15px}
.bk-total{border-bottom:0;border-top:2px solid var(--ink);margin-top:4px;padding-top:12px}
.bk-total span{font-weight:600;color:var(--ink)} .bk-total b{font-size:22px;letter-spacing:-.02em}
.bk-lg .bk-row b{font-size:17px} .bk-lg .bk-total b{font-size:30px}
.bk-note{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:8px}
.bk-note svg,.notice svg{width:15px;height:15px;flex:none;margin-top:1px}
.hello{margin-bottom:18px}.hello h1{margin:0;font-size:30px;letter-spacing:-.03em;font-weight:600}.hello p{margin:2px 0 0;color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:2px;padding:6px 16px}
.step{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.step:last-child{border-bottom:0}
.step-n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--muted);flex:none}
.step-n svg{width:14px;height:14px}
.step.ok .step-n{background:var(--green);border-color:var(--green);color:#fff}
.step div{flex:1;min-width:0}.step b{display:block;font-weight:600}.step span{font-size:12.5px;color:var(--muted)}
.step.ok b{color:var(--muted)}
.apv{display:grid;grid-template-columns:170px minmax(0,1fr) 130px auto;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line-2)}
.apv:first-child{border-top:0}
.apv-who{display:flex;gap:10px;align-items:center}.apv-who b{display:block}.apv-who span{font-size:12px;color:var(--muted)}
.apv-what{border:0;background:none;text-align:left;padding:0;min-width:0}.apv-what b{display:block;font-weight:600}.apv-what span{display:block;font-size:12.5px;color:var(--muted)}
.apv-val{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:4px;padding:0 10px;height:36px;background:var(--surface)}
.apv-val span{color:var(--muted);font-size:13px}.apv-val input{border:0;background:none;width:100%;text-align:right;font-weight:600;outline:none}
.apv-val:focus-within{outline:2px solid var(--accent);border-color:transparent}
.apv-acts{display:flex;gap:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.viewas{display:flex;gap:10px;align-items:center;background:var(--accent-soft);color:var(--accent);padding:10px 28px;font-size:13.5px;border-bottom:1px solid var(--line)}
.viewas svg{width:16px;height:16px;flex:none}.viewas span{flex:1}.viewas b{font-weight:600}
.userbox{display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid var(--line-2);margin-top:8px}
.ub-t{flex:1;min-width:0}.ub-t b{display:block;font-size:13.5px}.ub-t span{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.datef{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.datef input{height:34px;border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:0 8px;font-size:13px}
.addrow{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.tag.pay{border-color:color-mix(in srgb,var(--green) 40%,var(--line));color:var(--green);background:var(--green-soft)}
.notice.pay{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 30%,var(--line));color:var(--ink)}
.rowbtn{width:100%;border:0;border-top:1px solid var(--line-2);background:none;text-align:left}
.linkrow{border:0;background:none;padding:0;text-align:left}
.head-acts{display:flex;gap:8px;flex-wrap:wrap}
.nowrap{white-space:nowrap}
#gate{display:none}
body.gated #gate{display:flex;position:fixed;inset:0;z-index:150;background:var(--bg);align-items:center;justify-content:center;padding:20px;overflow:auto}
body.gated .app,body.gated .mobile-nav{display:none!important}
.gate-card{width:min(560px,100%);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:28px;box-shadow:var(--shadow)}
.gate-card h2{margin:6px 0 6px;font-size:22px;letter-spacing:-.02em}
.gate-card .brandmark{padding:0 0 14px}
.gate-h{margin:18px 0 8px;font-size:12.5px;color:var(--muted);font-weight:500}
.gate-users{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mk-pick{position:relative}
.mk-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 28px rgba(0,0,0,.14);max-height:250px;overflow:auto;padding:4px}
.mk-opt{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:4px;cursor:pointer;font:inherit;color:var(--ink)}
.mk-opt:hover,.mk-opt.hl{background:var(--surface-2)}.mk-opt small{color:var(--muted);font-size:12px}
.mk-opt.nova{color:var(--accent);font-weight:600}.mk-aviso{font-size:12px;color:var(--ink-2);padding:6px 10px;border-top:1px solid var(--line);margin-top:2px}
.mk-st{display:block;font-size:12px;margin-top:5px;color:var(--muted)}.mk-st b{color:var(--ink)}
.mk-nova-tag{font-size:11px;font-weight:600;color:var(--accent);margin-left:4px}
.gate-sug{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-2px 0 6px}
.gate-chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:4px 11px;cursor:pointer}.gate-chip:hover{border-color:var(--ink)}
.gate-user{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:10px;text-align:left}
.gate-form{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.gate-form .btn{height:40px}
.gate-err{color:var(--red);font-size:13px;margin:0;min-height:1em}
.gate-me{display:flex;gap:14px;align-items:center}.gate-me h2{margin:0}.gate-me p{margin:2px 0 0}
.gate-user:hover{border-color:var(--ink)}.gate-user b{display:block}.gate-user small{color:var(--muted);font-size:12px}
@media (max-width: 1180px){ .apv{grid-template-columns:minmax(0,1fr) 130px;} .apv-what{grid-column:1/-1;grid-row:2} .apv-acts{grid-column:1/-1;justify-content:flex-end} }
@media (max-width: 860px){
  .kpis.k3{grid-template-columns:minmax(0,1fr)} .kpis.k3 .kpi{border-right:0;border-bottom:1px solid var(--line-2)}
  .viewas{padding:10px 14px;flex-wrap:wrap}
  .apv{grid-template-columns:minmax(0,1fr)} .apv-what,.apv-acts{grid-row:auto}

}

@media print{
  body *{visibility:hidden}
      .app{display:block}
}

/* ---------- Identidade Boltz ---------- */
h1,h2,h3,.page-head h1,.card-h h2,.card-h h3,.gate-card h2{font-family:var(--display)}
.page-head h1{font-size:30px;font-weight:700;letter-spacing:-.03em}
.card-h h2,.card-h h3{font-weight:600}
.card-h .sub{font-family:var(--font)}
.kpi .k-l,.t th,.gate-h,.results h6{font-family:var(--mono);font-size:10.5px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.kpi .k-v{font-family:var(--display);font-weight:700;letter-spacing:-.02em}
.t th{color:var(--muted);background:var(--surface-2)}
.t .num,.t tfoot td{font-variant-numeric:tabular-nums}
.t tfoot td{font-family:var(--mono);font-weight:700;font-size:12.5px}
.nav button{font-weight:600}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 2px 0 0 var(--accent)}
.btn{font-weight:600}
.mbtn .ml{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em}
.mbtn .mbar i{background:var(--accent)}
.badge{border-radius:3px}
.side-foot{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em}

/* relatório no padrão dos reports Boltz */
.report{background:#F5F0E8;color:#141414;border:1px solid #E2DBCF;border-radius:4px;padding:56px 56px 40px;max-width:860px;font-family:"Nunito Sans",system-ui,sans-serif;counter-reset:rsec}
.report .rtop{display:flex;justify-content:space-between;align-items:center;padding-bottom:22px;border-bottom:1px solid #E2DBCF;margin-bottom:34px}
.report .rtop .bz{display:flex;align-items:center;gap:1px}.report .rtop .bz svg{width:18px;height:28px}
.report .rtop .bz span{font-family:"Poppins",sans-serif;font-weight:700;font-size:30px;letter-spacing:-.045em;line-height:1}
.report .rtag{font-family:"Space Mono",monospace;font-size:12px;letter-spacing:.3em;color:#6B655C;text-transform:uppercase}
.report h1{font-family:"Poppins",sans-serif;font-size:44px;line-height:1.08;letter-spacing:-.03em;font-weight:700;margin:0}
.report h1 em{font-style:normal;color:#7B3FE4;display:block}
.report .rsub{color:#5A554D;margin:14px 0 32px;font-size:17px}
.report .rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid #E2DBCF;border-radius:2px;margin-bottom:18px;background:#FBF8F3}
.report .rgrid div{padding:18px 20px;border-right:1px solid #E2DBCF}
.report .rgrid div:last-child{border-right:0}
.report .rgrid span{font-family:"Space Mono",monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#7B3FE4;display:block;margin-bottom:6px}
.report .rgrid b{font-family:"Poppins",sans-serif;font-size:22px;letter-spacing:-.02em}
.report .rgrid:first-of-type b:first-of-type{color:#7B3FE4}
.report h2{font-family:"Space Mono",monospace;font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;margin:38px 0 10px;padding-top:22px;border-top:1px solid #E2DBCF}
.report h2::before{counter-increment:rsec;content:counter(rsec,decimal-leading-zero);color:#7B3FE4;margin-right:22px}
.report table{width:100%;border-collapse:collapse;font-size:15px}
.report td,.report th{padding:8px 0;border-bottom:0;text-align:left}
.report th{font-family:"Space Mono",monospace;color:#9C958A;font-weight:400;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
.report td.r{color:#5A554D}
.report .r{text-align:right}
.report a{color:#7B3FE4}
.report .foot{margin-top:40px;padding-top:20px;border-top:1px solid #E2DBCF;font-family:"Space Mono",monospace;font-size:11px;color:#9C958A;display:flex;justify-content:space-between;align-items:center}
.report .foot .bz{display:flex;align-items:center;gap:1px;color:#141414}.report .foot .bz svg{width:11px;height:17px}
.report .foot .bz span{font-family:"Poppins",sans-serif;font-weight:700;font-size:17px;letter-spacing:-.045em;color:#141414}
@media (max-width:640px){.report{padding:28px 20px}.report h1{font-size:32px}.report .rgrid{grid-template-columns:1fr}.report .rgrid div{border-right:0;border-bottom:1px solid #E2DBCF}.report .rtag{display:none}}

/* ---------- atividades ---------- */
.atv-tipos{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.atv-cta{margin-top:14px;display:flex;justify-content:flex-end}
.atv-cta .btn{white-space:normal;height:auto;min-height:34px;padding:7px 14px;text-align:center}

<script>
"use strict";
/* =====================================================================
   CENTRAL DE OPERAÇÃO E PAGAMENTOS
   Camadas: utilitários › backend (conta Claude ou navegador) › repositório
   › sessão/permissões › domínio de marcas › domínio de equipe › UI.

   Documentos (mesmo layout nos dois backends):
     pub/dir                 usuários (sem valores), marcas (nome), categorias, tipos de trabalho
     adm/core                marcas completas, contratos, entregas contratuais, recebimentos   [só admin]
     adm/equipe              valor fixo (histórico), fechamentos, pagamentos a colaboradores   [só admin]
     adm/trab-YYYY-MM        trabalhos remunerados da competência                               [só admin]
     meses/YYYY-MM           demandas da competência (sem valores)
     fin/<conta>             espelho financeiro de UM colaborador                  [admin + o próprio]
     envios/<conta>/itens/*  trabalhos enviados pelo colaborador, aguardando aprovação          [admin + o próprio]
     acesso/<conta>          pedido de vínculo de uma conta a um usuário                         [admin + o próprio]
     cred/<conta>            hash da senha (PBKDF2), nunca a senha                              [admin + o próprio]
   As regras de leitura/escrita são aplicadas pelo servidor (declaradas na publicação).
   ===================================================================== */

/* ---------- Utilitários ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = (p = "id") => p + "_" + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const pad = (n, l = 2) => String(n).padStart(l, "0");
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const MESES = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
const MESES_C = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
const DIAS_C = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const ymOf = iso => String(iso || "").slice(0, 7);
const ymParts = ym => ym.split("-").map(Number);
function addMonths(ym, n) { let [y, m] = ymParts(ym); m += n; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return `${y}-${pad(m)}`; }
function monthDiff(a, b) { const [ya, ma] = ymParts(a), [yb, mb] = ymParts(b); return (yb - ya) * 12 + (mb - ma); }
const dim = ym => { const [y, m] = ymParts(ym); return new Date(y, m, 0).getDate(); };
const labelMes = ym => { const [y, m] = ymParts(ym); return `${MESES[m - 1]} ${y}`; };
const labelMesC = ym => { const [y, m] = ymParts(ym); return `${MESES_C[m - 1]} ${y}`; };
const dateIn = (ym, day) => `${ym}-${pad(Math.max(1, Math.min(day, dim(ym))))}`;
const parseD = iso => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
function ymdArr(iso) { const [y, m, d] = iso.split("-").map(Number); return [y, m - 1, d]; }
const diffDays = (a, b) => Math.round((Date.UTC(...ymdArr(b)) - Date.UTC(...ymdArr(a))) / 864e5);
const addDays = (iso, n) => { const d = parseD(iso); d.setDate(d.getDate() + n); return isoOf(d); };
const lastDay = ym => dateIn(ym, 31);
const fmtData = iso => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}` : "—";
const fmtDataL = iso => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}` : "—";
const fmtBRL = v => (Number(v) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL", minimumFractionDigits: (Number(v) % 1) ? 2 : 0, maximumFractionDigits: 2 });
const norm = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const slug = s => norm(s).replace(/[^a-z0-9]+/g, "");
const num = v => { if (typeof v === "number") return isFinite(v) ? v : 0; const s = String(v || "").trim().replace(/[R$\s]/g, ""); if (!s) return 0; const n = s.includes(",") ? Number(s.replace(/\./g, "").replace(",", ".")) : Number(s); return isFinite(n) ? n : 0; };
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const soma = (arr, f = x => x) => arr.reduce((a, x) => a + num(f(x)), 0);
function hash(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
function businessDays(ym) { const out = []; for (let d = 1; d <= dim(ym); d++) { const iso = dateIn(ym, d); const w = parseD(iso).getDay(); if (w > 0 && w < 6) out.push(iso); } return out; }
function mondaysIn(ym) { let n = 0; for (let d = 1; d <= dim(ym); d++) if (parseD(dateIn(ym, d)).getDay() === 1) n++; return n; }
const iniciais = s => String(s || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
async function sha(s) { try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); } catch (_) { return "h" + hash(s); } }

let TODAY = isoOf(new Date());
let CUR = ymOf(TODAY);

/* ---------- Constantes ---------- */
const STATUS = {
  a_fazer: { label: "A fazer", cls: "b-gray", c: "var(--faint)" },
  andamento: { label: "Em andamento", cls: "b-yellow", c: "var(--yellow)" },
  concluido: { label: "Concluído", cls: "b-green", c: "var(--green)" },
  atrasado: { label: "Atrasado", cls: "b-red", c: "var(--red)" },
  cancelado: { label: "Cancelado", cls: "b-gray", c: "var(--ink)" },
};
const PAG = { pendente: { label: "Pendente", cls: "b-yellow" }, parcial: { label: "Parcial", cls: "b-blue" }, pago: { label: "Pago", cls: "b-green" }, atrasado: { label: "Atrasado", cls: "b-red" } };
const MARCA_ST = { ativo: { label: "Ativo", cls: "b-green" }, pausado: { label: "Pausado", cls: "b-yellow" }, encerrado: { label: "Encerrado", cls: "b-gray" } };
const PERIOD = { mensal: "Mensal", semanal: "Semanal", unica: "Única", personalizada: "Personalizada" };
const TRAB_ST = {
  pendente: { label: "Pendente de aprovação", curto: "Pendente", cls: "b-yellow" },
  aprovado: { label: "Aprovado", curto: "Aprovado", cls: "b-green" },
  pago: { label: "Pago", curto: "Pago", cls: "b-blue" },
  recusado: { label: "Recusado", curto: "Recusado", cls: "b-red" },
};
const GRUPOS = { avulso: "Trabalho avulso", diaria: "Diária", outro: "Outros valores" };
const MES_ST = { aberto: { label: "Em aberto", cls: "b-gray" }, fechado: { label: "Fechado, a pagar", cls: "b-yellow" }, parcial: { label: "Pago parcialmente", cls: "b-blue" }, pago: { label: "Pago", cls: "b-green" } };
const PAPEL = { admin: { label: "Admin", cls: "b-dark" }, colaborador: { label: "Colaborador", cls: "b-gray" } };

/* ---------- Estado inicial (somente cadastros reais, sem dados fictícios) ---------- */
const USUARIOS_INICIAIS = [["Isabella", "admin"], ["Duda", "admin"], ["João", "colaborador"], ["Fellipe", "colaborador"], ["Gabriel", "colaborador"], ["André", "colaborador"], ["Letícia", "colaborador"]];
const TIPOS_INICIAIS = [["Evento", "avulso", 300], ["Produção", "avulso", 300], ["Ativação", "avulso", 0], ["Visita à loja", "avulso", 150], ["Conteúdo", "avulso", 0], ["Seeding", "avulso", 0], ["Reunião", "avulso", 0], ["Diária", "diaria", 250], ["Freelancer", "avulso", 0], ["Hora extra", "avulso", 0], ["Outro", "outro", 0]];
const CATS_INICIAIS = ["Conteúdo", "Fotografia", "Seeding", "Influenciadores", "Loja", "Ativação", "Evento", "Reunião"];
function estadoInicial() {
  return {
    dir: {
      versao: 2,
      usuarios: USUARIOS_INICIAIS.map(([nome, papel]) => ({ id: "u_" + slug(nome), nome, papel, ativo: true, funcao: "", email: "", telefone: "", claudeId: "", desativadoEm: "" })),
      marcas: [], categorias: CATS_INICIAIS.map(n => ({ id: "c_" + slug(n), nome: n })),
      tipos: TIPOS_INICIAIS.map(([nome, grupo, valor]) => ({ id: "t_" + slug(nome), nome, grupo, valor })),
    },
    core: { marcas: [], contratos: [], obrigacoes: [], pagamentos: [], inicioUso: CUR },
    equipe: { fin: {}, fechamentos: [], pagamentos: [], contracheques: [] },
    trab: {}, months: {}, envios: [], acessos: [], creds: {}, ativ: {},
  };
}
let S = estadoInicial();

/* ---------- Backends ---------- */
const LocalBackend = {
  KEY: "gm2:db", _m: null,
  load() { if (!this._m) { try { this._m = JSON.parse(localStorage.getItem(this.KEY)) || {}; } catch (_) { this._m = {}; } } return this._m; },
  persist() { try { localStorage.setItem(this.KEY, JSON.stringify(this._m)); } catch (_) { } },
  async get(p) { const v = this.load()[p]; return v ? clone(v) : null; },
  async set(p, d) { this.load()[p] = clone(d); this.persist(); },
  async del(p) { delete this.load()[p]; this.persist(); },
  async list(col) { const pre = col + "/"; const m = this.load(); return Object.keys(m).filter(k => k.startsWith(pre) && !k.slice(pre.length).includes("/")).map(k => ({ id: k.slice(pre.length), data: clone(m[k]) })); },
  async wipe() { this._m = {}; this.persist(); },
  watch(col, cb, onErr, f) { const run = () => this.list(col).then(ds => cb(f ? ds.filter(d => (d.data[f.campo] || []).includes(f.valor)) : ds)); run(); const h = e => { if (e.key === this.KEY) { this._m = null; run(); } }; window.addEventListener("storage", h); return () => window.removeEventListener("storage", h); },
};
function ClaudeBackend(db) {
  return {
    async get(p) { const s = await db.doc(p).get(); return s.exists ? clone(s.data()) : null; },
    async set(p, d) { await db.doc(p).set(clone(d)); },
    async del(p) { await db.doc(p).delete(); },
    async list(col) { const s = await db.collection(col).get(); return s.docs.map(d => ({ id: d.id, data: clone(d.data()) })); },
    watch(col, cb, onErr, f) { let q = db.collection(col); if (f) q = q.where(f.campo, f.op, f.valor); return q.onSnapshot(s => cb(s.docs.map(d => ({ id: d.id, data: clone(d.data()) }))), e => { console.warn(e); onErr && onErr(e); }); },
  };
}

/* ---------- Sessão e permissões ---------- */
const SESSION = { mode: "local", userId: null, cid: null, owner: false, canEdit: false, nomeConta: "", viewAs: null };
const getUser = id => S.dir.usuarios.find(u => u.id === id);
const realUser = () => getUser(SESSION.userId);
const me = () => getUser(SESSION.viewAs || SESSION.userId);
const isAdmin = () => !SESSION.viewAs && realUser()?.papel === "admin";
const canWriteKey = k => isAdmin() || k.startsWith("mes:");

/* ---------- Repositório ---------- */
const Repo = {
  be: LocalBackend, dirty: new Set(), base: {}, timer: null, busy: false, status: "ok", mirrorsDirty: false, mirrorsLast: {},
  pathOf(k) { if (k === "dir") return "pub/dir"; if (k === "core") return "adm/core"; if (k === "equipe") return "adm/equipe"; if (k.startsWith("trab:")) return "adm/trab-" + k.slice(5); if (k.startsWith("mes:")) return "meses/" + k.slice(4); },
  get(k) { if (k === "dir") return S.dir; if (k === "core") return S.core; if (k === "equipe") return S.equipe; if (k.startsWith("trab:")) return S.trab[k.slice(5)]; if (k.startsWith("mes:")) return S.months[k.slice(4)]; },
  put(k, d) { if (k.startsWith("trab:")) S.trab[k.slice(5)] = d; else if (k.startsWith("mes:")) S.months[k.slice(4)] = d; },
  arr(k) { return k.startsWith("trab:") ? "itens" : k.startsWith("mes:") ? "items" : null; },
  setBase(k, d) { const f = this.arr(k); if (f) this.base[k] = Object.fromEntries((d?.[f] || []).map(x => [x.id, JSON.stringify(x)])); },
  touch(...keys) {
    keys.forEach(k => { if (canWriteKey(k)) this.dirty.add(k); });
    if (keys.some(k => k === "equipe" || k === "dir" || k === "core" || k.startsWith("trab:"))) this.mirrorsDirty = true;
    this.schedule();
  },
  schedule() { clearTimeout(this.timer); this.setStatus("saving"); this.timer = setTimeout(() => this.flush(), 450); },
  async flush() {
    if (this.busy) { this.timer = setTimeout(() => this.flush(), 300); return; }
    this.busy = true; let mudouRemoto = false;
    try {
      const keys = [...this.dirty]; this.dirty.clear();
      for (const k of keys) {
        let data = this.get(k); if (!data) continue;
        const f = this.arr(k), p = this.pathOf(k);
        if (f && SESSION.mode === "conta") {
          // mescla item a item com a versão do servidor para não sobrescrever edições de outra pessoa
          const remoto = await this.be.get(p);
          if (remoto) { const r = mergeArr(remoto, data, f, this.base[k] || {}); if (r.extra) mudouRemoto = true; data = r.doc; this.put(k, data); }
        }
        await this.be.set(p, data); this.setBase(k, data);
      }
      if (this.mirrorsDirty && isAdmin() && SESSION.mode === "conta") { this.mirrorsDirty = false; await escreverEspelhos(); await escreverPubContratos(); }
      this.setStatus("ok");
      if (mudouRemoto) render();
    } catch (e) { console.warn("Falha ao salvar", e); this.setStatus("erro"); toast("Não foi possível salvar. Verifique sua conexão e permissão de edição."); }
    finally { this.busy = false; }
  },
  setStatus(s) {

/* ---------- Calendário ---------- */
function viewCalendario() {
  const mes = UI.mes;

  const byD = {}; its.forEach(it => { (byD[it.data] ||= []).push(it); });
  const startW = parseD(dateIn(mes, 1)).getDay(); const cells = [];

  const legend = `<div class="legend" style="margin-top:12px;flex-wrap:wrap">${["a_fazer", "andamento", "concluido", "atrasado"].map(k => `<span><i style="background:${STATUS[k].c}"></i>${STATUS[k].label}</span>`).join("")}<span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>Avulsa</span><span>${its.length ? "Clique em um dia para ver tudo e criar demandas." : "Nenhuma demanda neste mês."}</span></div>`;
  return head + filterBar() + note + grid + legend;

/* ---------- Atividades diárias: calendário → atividade → marca → colaborador → extras → relatórios ----------
   Registro:  ativ/{conta}/{AAAA-MM}/{id}   (o colaborador escreve só nos próprios; admin lê e edita todos)
   Extra:     trabalho aprovado em adm/trab-AAAA-MM com ativId (entra no total a receber, fechamento e pagamentos) */
const ATIV = {
  escritorio: { nome: "Escritório", emoji: "🏢", cor: "#6B655C", trab: "t_outro", dias: true },
  gavea: { nome: "Produção de conteúdo — Gávea", curto: "Produção Gávea", emoji: "🎥", cor: "#7B3FE4", trab: "t_producao" },
  showroom: { nome: "Showroom", emoji: "🏬", cor: "#C2410C", trab: "t_visitaaloja" },
  visita: { nome: "Visita técnica", emoji: "📍", cor: "#0E7490", trab: "t_visitaaloja" },
  shooting: { nome: "Shooting", emoji: "📸", cor: "#BE185D", trab: "t_producao" },
  lancamento: { nome: "Lançamento de campanha", curto: "Lançamento", emoji: "🚀", cor: "#B91C1C", trab: "t_ativacao" },
  evento: { nome: "Evento", emoji: "🎪", cor: "#A16207", trab: "t_evento" },
  home: { nome: "Home Office", emoji: "🏠", cor: "#15803D", trab: "t_outro", dias: true },
  social: { nome: "Projeto Social — São Januário", curto: "Projeto Social", emoji: "🤝", cor: "#4D7C0F", trab: "t_outro", para: ["u_leticia"] },
};
const ATIV_KEYS = Object.keys(ATIV);
/** tipos exclusivos de algumas pessoas (campo "para"); os demais valem para todos */
const ativPermitido = (k, userId) => !!ATIV[k] && (!ATIV[k].para || ATIV[k].para.includes(userId));
const ativKeysDe = userId => ATIV_KEYS.filter(k => ativPermitido(k, userId));
const PERIODOS = { integral: "Dia todo", manha: "Manhã", tarde: "Tarde", noite: "Noite" };
const PER_ORD = { integral: 0, manha: 1, tarde: 2, noite: 3, "": 4 };
const INTERNO = "_interno";
const ativNome = k => ATIV[k]?.nome || "Atividade";
const ativCurto = k => ATIV[k]?.curto || ativNome(k);
/** Clientes avulsos que só aparecem para algumas pessoas em alguns tipos de atividade (não são marcas com contrato). */
const CLIENTES_EXTRA = {
  _cl_flashz: { nome: "Flashz", tipos: ["evento"], para: ["u_andre", "u_leticia"] },
};
const clienteExtraOk = (id, tipo, userId) => { const c = CLIENTES_EXTRA[id]; return !!c && (!c.tipos || c.tipos.includes(tipo)) && (!c.para || c.para.includes(userId)); };
const clientesExtraDe = (tipo, userId) => Object.keys(CLIENTES_EXTRA).filter(id => clienteExtraOk(id, tipo, userId));
const marcaAtiv = id => id === INTERNO ? "Interno" : CLIENTES_EXTRA[id] ? CLIENTES_EXTRA[id].nome : id ? nomeMarca(id) : "Sem marca";
/** opções de marca/cliente do formulário de atividade, conforme tipo e pessoa */
function opcoesMarcaAtiv(tipo, userId, atual) {
  const ativas = S.dir.marcas.filter(m => m.status !== "encerrado" || m.id === atual);
  const extras = clientesExtraDe(tipo, userId); if (CLIENTES_EXTRA[atual] && !extras.includes(atual)) extras.push(atual);
  const o = (v, t) => `<option value="${v}" ${v === atual ? "selected" : ""}>${esc(t)}</option>`;
  return `<option value="" ${!atual ? "selected" : ""} disabled>Selecione a marca</option>${ativas.map(m => o(m.id, m.nome)).join("")}${extras.length ? `<optgroup label="Clientes">${extras.map(id => o(id, CLIENTES_EXTRA[id].nome)).join("")}</optgroup>` : ""}<option disabled>──────────</option>${o(INTERNO, "Interno / Sem marca")}`;
}
const cidDe = u => u ? (SESSION.mode === "conta" ? u.claudeId : u.id) : "";
/** Pasta das atividades: a conta da pessoa; se ela ainda não vinculou a conta, uma pasta só de admin
    (ativ/sc~{id}) que é movida para a conta dela quando o acesso é liberado. */
const ativPastaProvisoria = u => `sc~${u.id}`;
const ativBase = u => cidDe(u) || ativPastaProvisoria(u);
const ativOrd = (a, b) => (PER_ORD[a.periodo || ""] - PER_ORD[b.periodo || ""]) || String(a.hora || "99").localeCompare(String(b.hora || "99")) || String(a.criadoEm).localeCompare(String(b.criadoEm));

/* carga por mês, sob demanda */
function ativMes(mes) {
  const A = S.ativ[mes];
  if (!A) { carregarAtiv(mes); return null; }
  return A.ok ? A.itens : null;
}
async function carregarAtiv(mes) {
  if (S.ativ[mes]) return;
  S.ativ[mes] = { ok: false, itens: [] };
  const ru = realUser(); const adm = ru?.papel === "admin";
  const pessoas = (adm ? S.dir.usuarios : [ru]).filter(u => u && (adm || cidDe(u)));
  const itens = []; let erro = false;
  await Promise.all(pessoas.map(async u => {
    try {
      const cid = cidDe(u);
      if (cid) (await Repo.be.list(`ativ/${cid}/${mes}`)).forEach(d => itens.push({ ...d.data, id: d.id, userId: u.id, _base: cid }));
      if (adm && SESSION.mode === "conta") {
        const prov = ativPastaProvisoria(u);
        for (const d of await Repo.be.list(`ativ/${prov}/${mes}`)) {
          const a = { ...d.data, id: d.id, userId: u.id, _base: prov };
          if (cid) { try { const doc = { ...a }; delete doc._base; await Repo.be.set(`ativ/${cid}/${mes}/${a.id}`, doc); await Repo.be.del(`ativ/${prov}/${mes}/${a.id}`); a._base = cid; } catch (_) { } }
          itens.push(a);
        }
      }
    } catch (_) { erro = true; }
  }));
  S.ativ[mes] = { ok: true, itens, erro };
  if (SESSION.userId) render();
}
async function moverAtivProvisorias(u) {
  const cid = cidDe(u); if (!cid || SESSION.mode !== "conta") return;
  let m = S.core.inicioUso || CUR; const fim = addMonths(CUR, 2); m = addMonths(m, -1);
  for (; m <= fim; m = addMonths(m, 1)) {
    try {
      for (const d of await Repo.be.list(`ativ/${ativPastaProvisoria(u)}/${m}`)) {
        const doc = { ...d.data }; delete doc._base;
        await Repo.be.set(`ativ/${cid}/${m}/${d.id}`, doc); await Repo.be.del(`ativ/${ativPastaProvisoria(u)}/${m}/${d.id}`);
      }
    } catch (_) { }
  }
  S.ativ = {};
}
function ativFind(id) { for (const m in S.ativ) { const a = (S.ativ[m].itens || []).find(x => x.id === id); if (a) return a; } return null; }
function extraDe(ativId) { return Object.values(S.trab).flatMap(T => T.itens || []).find(t => t.ativId === ativId && t.status !== "recusado"); }
const extraValor = a => num(extraDe(a.id)?.valor);
const extraTravado = t => !!(t && getFech(t.userId, t.mes) && (t.status === "aprovado" || t.status === "pago"));
function tipoTrabDe(k) {
  const id = ATIV[k]?.trab; if (getTipo(id)) return id;
  return (S.dir.tipos.find(t => t.grupo === "outro") || S.dir.tipos.find(t => t.grupo === "avulso") || S.dir.tipos[0])?.id || "";
}
/** atividades visíveis na tela atual, já filtradas */
function ativVisiveis(mes, pessoal) {
  const lista = ativMes(mes); if (!lista) return null;
  const F = UI.A;
  return lista.filter(a => (pessoal ? a.userId === me().id : (!F.user || a.userId === F.user))
    && (!F.marca || a.marcaId === F.marca) && (!F.tipo || a.tipo === F.tipo));
}
function resumoAtiv(lista) {
  const r = { dias: new Set(), porTipo: {}, extras: 0, n: lista.length };
  ATIV_KEYS.forEach(k => { r.porTipo[k] = { n: 0, dias: new Set() }; });
  lista.forEach(a => {
    r.dias.add(a.userId + a.data);
    const p = r.porTipo[a.tipo]; if (p) { p.n++; p.dias.add(a.userId + a.data); }
    r.extras += extraValor(a);
  });
  return r;
}
/** escritório e home office contam em dias; o resto em número de atividades */
const contaTipo = (r, k) => ATIV[k].dias ? r.porTipo[k].dias.size : r.porTipo[k].n;
function diaHomeOffice(arr) { return arr.length > 0 && arr.every(a => a.tipo === "home"); }

/* Trabalhos aprovados entram sozinhos no calendário (não duplica dados: vêm de adm/trab-* ou do espelho do colaborador).
   Os que são extra de uma atividade já aparecem dentro dela. */
const TRAB_CAL = { emoji: "💼", cor: "#1D4ED8", nome: "Trabalho aprovado" };
const TRAB_KEY = "_trab";
function trabsCalendario(mes, pessoal) {

  return trabalhosTodos().filter(t => (t.status === "aprovado" || t.status === "pago") && !t.ativId && ymOf(t.data) === mes

    && (!F.marca || (F.marca === INTERNO ? !t.marcaId : t.marcaId === F.marca)));
}
const marcaTrab = t => t.marcaId ? nomeMarca(t.marcaId) : "Sem marca";
const tituloTrab = t => nomeTipo(t.tipoId);
function resumoCal(lista, trabs) {

  r.trabN = trabs.length; r.trabV = soma(trabs, t => t.valor);
  trabs.forEach(t => r.dias.add(t.userId + t.data));
  r.valor = r.extras + r.trabV;

}
